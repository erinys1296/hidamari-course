<style>

const TEXTS = {"map.title": {"ja": "N5 旅行編「はじめての日本」", "zh": "N5 旅行篇「はじめての日本」"}, "map.intro": {"ja": "台湾人の林雨晴（リン・ユーチン）が初めて一人で東京を3週間旅行し、下町の民宿「ひだまりハウス」に泊まります。全{lessons}課・文法項目{grammar}個。各課では既習の文法だけを使い、以前に学んだ難しめの文法には何課で学んだかを表示しています。課の順番は『みんなの日本語』『新版標準日本語』を参考にしつつ、旅行で必要な順に調整しました（例：「〜をください」は第4課、「〜ましょうか」は第8課）。「文法系統/N5」の22単元はすべて含まれています（各課にどの回を扱うか表示）。", "zh": "林雨晴第一次自己到東京旅行三週，住在老街區的民宿「ひだまりハウス」。{lessons} 課、{grammar} 個文法點，每課只用學過的文法；之前學過、比較難的會標出是哪一課學的。課程順序參考《大家的日本語》《新標日》，再依旅遊需求調整（例如「〜をください」第 4 課、「〜ましょうか」第 8 課就學），並涵蓋「文法系統/N5」全部 22 個單元（每課標出涵蓋哪幾回）。"}, "world.setting": {"ja": "2024年春の東京。物語の拠点は台東区にある架空の下町「あおば町」の民宿「ひだまりハウス」（2階建ての古い木造町家を改装した宿で、入口には太陽の絵ののれん）。浅草・上野・渋谷・京都・大阪など実在の場所にも出かけます。", "zh": "2024 年春天的東京。故事據點是台東區一個虛構的老街區「あおば町」裡的民宿「ひだまりハウス」（兩層樓的老木造町屋改建，門口掛著畫了太陽的暖簾）。出門會去淺草、上野、澀谷、京都、大阪等真實地點。"}, "world.timeline_note": {"ja": "対象学習者の優先順位は「旅行 → 仕事 → 学業」なので、主人公の人生もこの順番で進みます。物語は2024年から始まり、職場編がちょうど2025〜2026年になるため、その年の時事を取り入れられます。", "zh": "目標族群依序是旅遊 → 工作 → 讀書，所以主角的人生也照這個順序走。故事從 2024 年開始，職場篇剛好落在 2025–2026 年，可以帶入當年的時事。"}, "world.topics_note": {"ja": "時事の題材は、その課を書く時点で最新の状況を再確認します。本文には、すでに起きていて古くなりにくい事実だけを使います。", "zh": "時事題材在寫到那一課時要再查證最新狀況；課文裡只用已經發生、不容易過時的事實。"}, "level.N5.summary": {"ja": "雨晴が初めて一人で日本を3週間旅行し、ひだまりハウスに泊まる。あいさつ、買い物、電車、旅館の予約まで。"}, "level.N5.topics": {"ja": "2024年の桜の季節\n訪日観光客の増加\n交通系ICカード・スマホ決済"}, "level.N4.summary": {"ja": "雨晴がワーキングホリデービザで東京に戻り、カフェでアルバイト、部屋探し、各種手続きをしながら、デザイン会社の面接に備える。"}, "level.N4.topics": {"ja": "2024年7月発行の新紙幣（渋沢栄一の一万円札）\n健康保険証からマイナ保険証へ（2024年12月〜）\n物価上昇・アルバイトの時給\nキャッシュレス決済"}, "level.N3.summary": {"ja": "デザイン会社にUIデザイナーとして入社。報連相、顧客との打ち合わせ、残業、同僚との付き合い。"}, "level.N3.topics": {"ja": "大阪・関西万博（2025年4〜10月）：会社が万博関連のデザイン案件を受注\n米の価格高騰（令和の米騒動）\n職場への生成AI導入\n訪日客過去最多・オーバーツーリズム\n猛暑と熱中症対策\n賃上げと物価"}, "level.N2.summary": {"ja": "プロジェクトを任され、企画書やプレゼンを担当。大学院進学も考え始める。"}, "level.N2.topics": {"ja": "2026年FIFAワールドカップ（6〜7月、北米開催）\nアジア競技大会・愛知・名古屋（2026年9〜10月）\nAIエージェントと働き方の変化\n円相場とインバウンド\n副業・リモートワーク"}, "level.N1.summary": {"ja": "東京の大学院でデザインを学ぶ。論文を読み、発表し、社会問題について議論する。"}, "level.N1.topics": {"ja": "少子高齢化と地方創生\nAIと著作権\nサステナブルデザイン"}, "char.yuqing.from": {"ja": "台湾・台北"}, "char.yuqing.role": {"ja": "主人公。台北のUIデザイナーで、初めて一人で3週間の日本旅行に来た。"}, "char.yuqing.personality": {"ja": "好奇心旺盛でスケッチが好き。日本語は少しだけ話せ、「なにで」をよく「なんで」と聞き間違える。"}, "char.yuqing.speech": {"ja": "目上の人や店員には「です・ます」、その後、蓮や柏宇とは普通体で話す。"}, "char.yuqing.arc": {"ja": "N5 旅行 → N4 ワーホリで東京へ・就職活動 → N3〜N2 デザイン会社勤務 → N1 大学院"}, "char.misaki.from": {"ja": "東京・あおば町"}, "char.misaki.role": {"ja": "民宿「ひだまりハウス」の女将。元日本語学校の教師で、手作りのカードで宿泊客と日本語ゲームをするのが好き。"}, "char.misaki.personality": {"ja": "やさしく、根気強く、面倒見がいい。物語の中の「日本語の先生」役。"}, "char.misaki.speech": {"ja": "宿泊客には「です・ます」で、ゆっくり話す。"}, "char.misaki.arc": {"ja": "シリーズを通しての拠点人物。N4以降は東京での雨晴の「お母さん」的存在。"}, "char.ren.from": {"ja": "東京"}, "char.ren.role": {"ja": "大学3年生。ひだまりハウスのフロントでアルバイトをしている。フィルムカメラをいつも持ち歩いている。"}, "char.ren.personality": {"ja": "少し眠そうで人見知り。写真とアニメの話になると止まらない。"}, "char.ren.speech": {"ja": "仕事中は「です・ます」、親しくなると普通体（N5第26課の普通体会話の主役）。"}, "char.ren.arc": {"ja": "N3から雨晴の会社のインターンに。N1では雨晴と同じ大学院。"}, "char.emma.from": {"ja": "オーストラリア・メルボルン"}, "char.emma.role": {"ja": "ひだまりハウスに長期滞在しているフリーのカメラマン。日本語も勉強中で、雨晴の「クラスメート」。"}, "char.emma.personality": {"ja": "行動派で何でも試してみたい。かわいい日本語の間違いが多い（学習者によくある間違いを見せる役）。"}, "char.emma.speech": {"ja": "「です・ます」。ときどき助詞を間違える。"}, "char.emma.arc": {"ja": "N4から東京で仕事を受けるように。N3では雨晴の仕事仲間。"}, "char.boyu.from": {"ja": "台湾・台中"}, "char.boyu.role": {"ja": "雨晴の高校の同級生。東京のIT企業に勤めて3年目。"}, "char.boyu.personality": {"ja": "マイペースで食べるのが好き。「台湾人が日本で働く」日常を見せる役。"}, "char.boyu.speech": {"ja": "雨晴とは普通体、会社では「です・ます」。"}, "char.boyu.arc": {"ja": "N5最終課で「会社がデザイナーを探している」と話す → N4仕事編への導入。N4〜N2職場編の先輩。"}, "char.hana.from": {"ja": "ひだまりハウス"}, "char.hana.role": {"ja": "民宿の三毛猫。よく食べ物を盗み食いする。練習問題のムードメーカー。"}, "char.hana.personality": {"ja": "食いしん坊でよく寝る。"}, "char.hana.speech": {"ja": "（猫）"}, "char.hana.arc": {"ja": "シリーズを通してのマスコット。"}, "place.hidamari": {"ja": "ひだまりハウス（民宿）"}, "place.aoba": {"ja": "あおば町（架空の下町）"}, "lesson.N5-L01.scene": {"ja": "雨晴が羽田空港から荷物を引いて民宿に着き、初めて日本語で自己紹介をし、トイレの場所を聞き、水を買う。"}, "lesson.N5-L02.scene": {"ja": "初めての和朝食。これは何？そのお茶碗はだれの？"}, "lesson.N5-L03.scene": {"ja": "蓮が雨晴に近所を案内する。駅、コンビニ、トイレはどこ？"}, "lesson.N5-L04.scene": {"ja": "初めて一人で買い物。いくら？これとそれを一つずつ。"}, "lesson.N5-L05.scene": {"ja": "美咲が宿の一日の流れを説明する。朝ごはんは何時から何時まで？雨晴は明日何時に起きる？"}, "lesson.N5-L06.scene": {"ja": "初めて一人で電車に乗って浅草へ。同じ宿に泊まっているエマと一緒に。"}, "lesson.N5-L07.scene": {"ja": "仲見世商店街で食べ歩き。"}, "lesson.N5-L08.scene": {"ja": "エマがみんなをスカイツリーに誘い、蓮が荷物を持ってあげる。"}, "lesson.N5-L09.scene": {"ja": "宿の夕食。はしで食べる、スマホで払う、日本語で話す。"}, "lesson.N5-L10.scene": {"ja": "蓮がカメラを持って雨晴と上野へ。パンダはどこ？トイレはどこ？"}, "lesson.N5-L11.scene": {"ja": "雨晴が美咲に台湾のパイナップルケーキを渡し、エマからはがきをもらう。"}, "lesson.N5-L12.scene": {"ja": "下町を散歩しながら、見たものを形容詞で説明する。"}, "lesson.N5-L13.scene": {"ja": "高校の同級生・柏宇が仕事帰りに雨晴を渋谷のラーメン屋に連れて行く。"}, "lesson.N5-L14.scene": {"ja": "雨の日は宿で過ごし、昨日行った場所の話をする。"}, "lesson.N5-L15.scene": {"ja": "東京・台北・メルボルンを比べる。"}, "lesson.N5-L16.scene": {"ja": "蓮と秋葉原にカメラを見に行く。"}, "lesson.N5-L17.scene": {"ja": "台湾にはがきを送る。切手は何枚？何日で着く？"}, "lesson.N5-L18.scene": {"ja": "エマと新幹線で京都へ。駅で人に助けを頼む。"}, "lesson.N5-L19.scene": {"ja": "バスの中から美咲に無事を知らせるメッセージを送る。"}, "lesson.N5-L20.scene": {"ja": "お寺で写真を撮ってもいい？食べ物はだめ。"}, "lesson.N5-L21.scene": {"ja": "旅館の夜。お風呂に入ってから晩ごはん。"}, "lesson.N5-L22.scene": {"ja": "旅館のルール。〜ないでください、〜なければなりません。"}, "lesson.N5-L23.scene": {"ja": "着物体験をしながら、お互いの趣味について話す。"}, "lesson.N5-L24.scene": {"ja": "大阪に出張中の柏宇と、旅の経験について話す。"}, "lesson.N5-L25.scene": {"ja": "温泉に入り、景色を見ながらおしゃべりする。"}, "lesson.N5-L26.scene": {"ja": "蓮と普通体でメッセージをやり取りする。"}, "lesson.N5-L27.scene": {"ja": "天気予報を見て、自分の意見を言う。"}, "lesson.N5-L28.scene": {"ja": "雨晴が旅のスケッチをみんなにプレゼントする。"}, "lesson.N5-L29.scene": {"ja": "春の強風で飛行機の時間が変わり、電話で空港近くのホテルを予約する。"}, "lesson.N5-L30.scene": {"ja": "帰国の日。柏宇が「うちの会社でデザイナーを探している」と言う……（N4仕事編へ）。"}, "lesson.N5-L01.story": {"ja": "夜9時、雨晴は羽田空港から電車に乗り、スーツケースを引いて路地の奥のひだまりハウスにたどり着く。女将の美咲とアルバイトの大学生・蓮がフロントで待っている。この課ではまず日本語の「特殊音」を正しく発音し、いちばん基本の文型「AはBです」で自己紹介をする。"}, "lesson.N5-L02.story": {"ja": "2日目の朝、雨晴は初めて和朝食を食べる。テーブルには見たことのないものがたくさん。これは何？そのお茶碗はだれの？棚の上で何かが動いているような……"}, "lesson.N5-L10.story": {"ja": "桜の季節の日曜日、上野公園は人でいっぱい。今日はアルバイトが休みの蓮が、カメラを持って雨晴と動物園へパンダを見に行く。でも、パンダはどこ？トイレはどこ？この課では「ある／いる」を学ぶ。物は「あります」、人と動物は「います」。"}, "lesson.N5-L10.memo.0": {"ja": "「で（動作）」と「に（存在）」の区別がいちばん重要。今後、毎課の助詞の総合穴埋めに1〜2問入れる。"}, "lesson.N5-L10.memo.1": {"ja": "乗り物に「あります」を使う例外は、第19課（バスに乗ります）でもう一度取り上げる。"}, "lesson.N5-L10.memo.2": {"ja": "虫・魚などの「ある／いる」の境界（地域差・個人差がある）は扱わず、人・動物・物で判断させる。"}, "lesson.N5-L10.memo.3": {"ja": "所有文（人は Nが あります）は「文法系統」第12回の構成どおり本課に入れ、存在文と対比させる。第13課では「わかります」だけを扱う。"}, "lesson.N5-L10.memo.4": {"ja": "否定（ありません・いません）は本課では軽く触れるだけ。第13課の「時間が ありますか」への答えで再度練習する。"}, "lesson.N5-L03.story": {"ja": "朝食のあと、蓮が雨晴に近所を案内する。駅はどこ？コンビニはどこ？和菓子屋は？コンビニでトイレを聞くと、店員は雨晴の知らない言葉「あちら」を使った。"}, "lesson.N5-L04.story": {"ja": "午後、蓮と一緒に朝見た和菓子屋へ。桜の季節限定の桜もちはいくら？雨晴は初めて自分で日本語で買い物をし、美咲と蓮へのおやつも買う。"}, "lesson.N5-L05.story": {"ja": "夜、美咲が居間で宿の一日を説明する。朝ごはんは何時から何時まで？お風呂は何時まで？明日は初めて一人で浅草へ。何時に起きる？"}, "lesson.N5-L06.story": {"ja": "雨晴は初めて一人で電車に乗る。あおば町駅で、同じひだまりハウスに泊まっているオーストラリア人カメラマンのエマに会う。二人とも浅草へ――でもエマの日本語はちょっと変？"}, "lesson.N5-L07.story": {"ja": "雷門の前は人でいっぱい。雷門で写真を撮り、仲見世で人形焼きを買ってメロンパンを食べる。ところが、エマのメロンパンをだれかが食べてしまった……だれ？"}, "lesson.N5-L08.story": {"ja": "土曜日の朝、エマがみんなをスカイツリーに誘う。蓮は2時までアルバイトなので、午後スカイツリーで会うことに。雨晴のかばんが重そうなのを見て、蓮が「持ちましょうか」。"}, "lesson.N5-L09.story": {"ja": "スカイツリーから帰ると、美咲がすき焼きを用意していた。生卵につけて食べる？これは日本語で何？明日の上野への行き方を聞かれ、雨晴はまた「なにで」を「なんで」と聞き間違える。"}, "lesson.N5-L11.story": {"ja": "上野から帰った夜、雨晴は台湾から持ってきたパイナップルケーキを美咲に渡す。エマも雨晴に絵はがきをくれる――でもエマはまた「あげます」と「くれます」を混同する。"}, "lesson.N5-L12.story": {"ja": "月曜日、雨晴はエマに借りたカメラを持って、エマと「猫の町」谷中を散歩する。古い町並み、メンチカツ、階段の猫――見たものを形容詞で言ってみる。"}, "lesson.N5-L13.story": {"ja": "夜、高校の同級生・柏宇が仕事のあと渋谷のラーメン屋へ連れて行ってくれる。東京のIT企業で働いて3年目。二人は日本では日本語だけで話すと決めた。初めての券売機は全部日本語……"}, "lesson.N5-L14.story": {"ja": "火曜日は雨。みんなで宿にいる。美咲は昨日の谷中と渋谷はどうだったかと聞く。エマはまた「きれいかったです」？雨の日、美咲は手作りのカードゲームを出す。"}, "lesson.N5-L15.story": {"ja": "雨がやんだ夜、三人でお茶を飲みながら東京・台北・メルボルンを比べる。どこが暑い？物価がいちばん高いのは？2024年は円安で、観光客には東京はむしろ「高くない」。"}, "lesson.N5-L16.story": {"ja": "蓮が秋葉原へデジタルカメラを見に行くので、雨晴もアニメグッズを買いについて行く。でもカメラは高いし、「免税」って何？歩き疲れて、雨晴は何か食べたくなる――"}, "lesson.N5-L17.story": {"ja": "雨晴は一人で郵便局へ。エマにもらった絵はがきと母への絵はがき、それにおみやげの箱を台湾へ送る。切手は何枚？台湾まで何日かかる？"}, "lesson.N5-L18.story": {"ja": "雨晴とエマは新幹線で京都へ。駅で人に助けを求めるにはどう言えばいい？この課では、これから多くの文法の基礎になる動詞の「て形」を学ぶ。"}, "lesson.N5-L19.story": {"ja": "京都のバスは観光客でいっぱい。雨晴はバスの中から美咲に無事を知らせるメッセージを送るが、エマはどこで降りるのかわからない。"}, "lesson.N5-L20.story": {"ja": "カメラマンのエマはどこでも撮りたい。しかし三十三間堂の堂内は撮影禁止。していいこと、いけないこと、標示が読めないときの聞き方を学ぶ。"}, "lesson.N5-L21.story": {"ja": "夜、旅館に戻る。先にお風呂？先にごはん？女将が夕食とお風呂の順番を説明する。雨晴は初めて浴衣を着る。"}, "lesson.N5-L22.story": {"ja": "エマは朝から撮影に出かけ、雨晴は一人で旅館に残る。大浴場にはルールがある。タオルを湯に入れない、先に体を洗う。女将が一つずつ説明する。"}, "lesson.N5-L23.story": {"ja": "京都の最後の日、雨晴とエマは着物を借りる。店員に着られるか、どのくらい歩けるかと聞かれ、二人はお互いの趣味についても話す。"}, "lesson.N5-L24.story": {"ja": "柏宇が大阪に出張で来ており、仕事のあと雨晴と道頓堀で会う。たこ焼きを食べたことがある？日本に住んで3年の柏宇には失敗談がたくさんある。"}, "lesson.N5-L25.story": {"ja": "雨晴とエマは神戸の山の中の有馬温泉へ。景色を見ながらおしゃべりする。日本語が上手になった、暖かくなった、将来は何になりたい？"}, "lesson.N5-L26.story": {"ja": "夜、蓮がLINEで「そんなに丁寧じゃなくていいよ」と送ってくる。二人は初めて友だち同士の普通体で話す。"}, "lesson.N5-L27.story": {"ja": "東京へ帰る新幹線で、天気予報を見ながらお互いの考えを話す。普通形を文の中で使う。「〜と思います」「〜と言いました」。"}, "lesson.N5-L28.story": {"ja": "東京に戻り、雨晴は旅のスケッチをみんなに見せる。「これはわたしが描いた絵です」。文で名詞を修飾する言い方を学ぶ。"}, "lesson.N5-L29.story": {"ja": "航空会社から連絡。春の強風で、帰りの便が早朝に変更された。雨晴は空港のホテルに電話する。日本語での電話予約は初めて。美咲がそばで応援する。"}, "lesson.N5-L30.story": {"ja": "帰国の朝、みんなが羽田まで見送りに来る。柏宇は取引先の会社がデザイナーを探していると話す。この3週間で学んだ日本語を、雨晴はすべて使う。"}, "lesson.N5-L03.memo.0": {"ja": "こ・そ・あ・ど の表（物／＋名詞／場所／丁寧）を一度に整理し、第2課の「これ・この」を復習する。"}, "lesson.N5-L03.memo.1": {"ja": "「二人で一緒に遠くを見る」場面では「そこ」を使わない点が最も間違えやすい。挿絵で練習する。"}, "lesson.N5-L03.memo.2": {"ja": "本課ではまだます形を学んでいないので、会話は「です」だけ。「Nは 場所に あります」は第10課。"}, "lesson.N5-L03.memo.3": {"ja": "人を紹介する「こちらは〜さんです」は旅館や会社でよく使う。第30課とN4仕事編でも再登場する。"}, "lesson.N5-L04.memo.0": {"ja": "300・600・800・3000・8000 の音の変化は表と聴解問題で練習する。値段は旅行でいちばん「聞き取り」が必要。"}, "lesson.N5-L04.memo.1": {"ja": "「を」は本課では「Nを ください」の定型表現として扱い、第7課の「Nを V」で改めてつなげる。"}, "lesson.N5-L04.memo.2": {"ja": "数量詞の位置（Nを ふたつ ください）は中国語と違うので、代入練習を多めに。"}, "lesson.N5-L04.memo.3": {"ja": "レジ袋の有料化（2020年7月〜）は実際の場面。「だいじょうぶです」（いりません）はコンビニでほぼ毎日使う。"}, "lesson.N5-L04.memo.4": {"ja": "最後に雨晴がお菓子を渡す「どうぞ」は、第11課「あげます」の伏線。"}, "lesson.N5-L05.memo.0": {"ja": "4時・7時・9時、ぷん／ふん、日付の特殊な読み方は量が多いので、本課ではまず「聞いてわかる」ことを目標にする。日付は第17課（期間）で復習。"}, "lesson.N5-L05.memo.1": {"ja": "ます形の「現在＝未来＋習慣」は中国語と対照して説明する。"}, "lesson.N5-L05.memo.2": {"ja": "「に」の判断：数字がある→つける、相対的な時（あした・毎朝）→つけない、曜日はどちらでも可（まず「つけてもいい」と教える）。"}, "lesson.N5-L05.memo.3": {"ja": "本課ではまだ「を」「へ」「で」を学んでいないので、「朝ごはんを 食べます」「浅草へ 行きます」のような文は意図的に避けている。"}, "lesson.N5-L06.memo.0": {"ja": "エマの初登場。「間違える→直される」パターンを今後も続け、よくある誤りを見せる。本課は「で」と「と」の混同。"}, "lesson.N5-L06.memo.1": {"ja": "行く・来る・帰るの視点（話し手がどこにいるか）は台湾→日本の例で説明する。「自分の国に戻る」は帰る。"}, "lesson.N5-L06.memo.2": {"ja": "「電車に 乗ります」（に）は第19課。本課は「電車で 行きます」だけ。"}, "lesson.N5-L06.memo.3": {"ja": "よ／ね の語感は場面で教え、訳語だけで覚えさせない。目上の人に「よ」を多用しない。"}, "lesson.N5-L06.memo.4": {"ja": "時事：2024年から首都圏でもクレジットカードのタッチ乗車に対応する路線が増えている。Suicaなどの交通系ICカードもあわせて紹介。"}, "lesson.N5-L07.memo.0": {"ja": "「で」の用法が二つ（乗り物・動作の場所）になるので本課で対比する。第9課で「道具・方法・言語」を加え、第10課で「に（存在）」と対比。"}, "lesson.N5-L07.memo.1": {"ja": "「が」は「疑問詞が主語→が」だけを扱い、は・が の詳しい違いはN5では深入りしない。"}, "lesson.N5-L07.memo.2": {"ja": "「何」の読み：何を（なに）／何ですか（なん）。学習者がよく読み間違える。"}, "lesson.N5-L07.memo.3": {"ja": "時事：浅草仲見世や京都錦市場などでは食べ歩きの自粛を呼びかけている。「こちらで どうぞ」と合わせてマナーを紹介。"}, "lesson.N5-L08.memo.0": {"ja": "ませんか（意向を聞く）／ましょう（決まっている）／ましょうか（申し出・相談）の三つを表で整理する。"}, "lesson.N5-L08.memo.1": {"ja": "断るときの「ちょっと……」は大切な文化のポイント。断る・断られる練習をさせる。"}, "lesson.N5-L08.memo.2": {"ja": "形容詞はまだ学んでいないので「いいですね」は使わず、誘いには「ええ、〜ましょう」で答える。第12課で形容詞を学んだあと補う。"}, "lesson.N5-L08.memo.3": {"ja": "「スカイツリーの 上」は位置名詞（第10課）としてチャンク表示。"}, "lesson.N5-L09.memo.0": {"ja": "「で」の用法は本課で三つ（場所・道具方法・乗り物）。表で一度に整理し、第10課で「に（存在）」と対比。"}, "lesson.N5-L09.memo.1": {"ja": "なにで／なんで の聞き間違いは雨晴のキャラクター設定。学習者にも演じさせる。正式な「なぜ」は第13課の「どうして」。"}, "lesson.N5-L09.memo.2": {"ja": "「まだです」の一言で答えればよい。「まだ〜ていません」はて形のあとで。"}, "lesson.N5-L09.memo.3": {"ja": "「家族に 電話します」の「に」（相手）は本課ではチャンクで自然に出し、第11課「人に あげます」で正式に整理する。"}, "lesson.N5-L09.memo.4": {"ja": "時事：2024年の日本はキャッシュレス決済が普及したが、小さい店では現金のみのことも多い。台湾との違いを話し合わせる。"}, "lesson.N5-L11.memo.0": {"ja": "あげる・くれる・もらう は矢印の図で方向を説明する。「受け取るのが私→くれる」がポイント。第三者同士のやりもらいはまず「あげる」だけ。"}, "lesson.N5-L11.memo.1": {"ja": "エマの誤り（わたしは〜に くれます）は学習者が最もよくする間違い。どこが違うか学習者に見つけさせる。"}, "lesson.N5-L11.memo.2": {"ja": "目上の人に直接「あげます」とは言わず、「どうぞ」だけ――マナーのポイント。"}, "lesson.N5-L11.memo.3": {"ja": "形容詞はまだ（第12課）なので、本課では「おいしい」「きれい」を意図的に使っていない。"}, "lesson.N5-L11.memo.4": {"ja": "教える／習う、貸す／借りる をペアで整理。「〜てあげる・〜てくれる」はN4。"}, "lesson.N5-L12.memo.0": {"ja": "い／な形容詞の分類は「語尾が『い』でなければ必ずな形容詞」でまず判断し、例外（きれい・きらい・ゆうめい）を覚える。"}, "lesson.N5-L12.memo.1": {"ja": "いい→よくない の例外は第14課の過去形（よかった）でもう一度出る。"}, "lesson.N5-L12.memo.2": {"ja": "「谷中は ねこが おおいです」（AはBが＋形容詞）はまず文として覚え、第13課「〜が 好きです」で整理する。"}, "lesson.N5-L12.memo.3": {"ja": "本課から聴解・読解（番外編）を加える。奇数課は読解、偶数課は聴解。本課の聴解は、宿で美咲と蓮がハナを探す話。"}, "lesson.N5-L12.memo.4": {"ja": "時事：谷中は近年外国人観光客に人気の「下町」。浅草と人の多さを比べてもよい。"}, "lesson.N5-L13.memo.0": {"ja": "柏宇の初登場。台湾人同士が日本語で話す設定（日本語だけで話すと約束）は、第26課で普通体に切り替える。"}, "lesson.N5-L13.memo.1": {"ja": "好き・わかる に「が」を使うのが最もよくある誤り（中国語の「喜歡＋目的語」の影響）。を／が の二択を多めに。"}, "lesson.N5-L13.memo.2": {"ja": "から（起点）と から（理由）、が（主語）と が（逆接）は同じ形で用法が違う。対比表で整理する。"}, "lesson.N5-L13.memo.3": {"ja": "「上手」は自分に使わない、「まだまだです」と謙遜して答える――文化のポイント。"}, "lesson.N5-L13.memo.4": {"ja": "読解は柏宇のブログ（番外編）。雨晴が東京に来る前に書いたもので、彼の過去を紹介する。第13課までの文法だけを使用。"}, "lesson.N5-L13.memo.5": {"ja": "時事：ラーメン屋の券売機、外国人観光客のラーメン人気。柏宇はITエンジニアで、N4以降の「仕事編」への伏線。"}, "lesson.N5-L14.memo.0": {"ja": "✕ さむいでした と ✕ きれいかったです が二大誤り。エマの誤りを例に学習者に直させる。"}, "lesson.N5-L14.memo.1": {"ja": "いい→よかった の例外は第12課（よくない）とつなげる。"}, "lesson.N5-L14.memo.2": {"ja": "聴解（番外編）はエマが1月に初めて日本に来た日の思い出。すべて過去形なので本課のまとめ復習に向いている。"}, "lesson.N5-L14.memo.3": {"ja": "会話に出る「もっと」は参考。比較の文法は第15課で正式に教える。"}, "lesson.N5-L15.memo.0": {"ja": "比較文の語順は中国語と違う（A比B熱 → AはBより あつい）。「より」の位置をよく間違える。"}, "lesson.N5-L15.memo.1": {"ja": "二つの比較はいつも「どちら」（人でも）。三つ以上のときだけ対象に合わせて疑問詞を変える。"}, "lesson.N5-L15.memo.2": {"ja": "「ほど＋否定」は婉曲な比較。「東京は メルボルンほど 高くない」のような実例で。"}, "lesson.N5-L15.memo.3": {"ja": "読解は美咲の過去（番外編）：長年日本語学校の先生だったこと、ひだまりハウスを始めたいきさつ。過去形と比較の復習にもなる。"}, "lesson.N5-L15.memo.4": {"ja": "時事：2024年の円安（1ドル160円を超えた時期もある）、訪日客が過去最多。"}, "lesson.N5-L16.memo.0": {"ja": "ほしい／たい はどちらもい形容詞。第12・14課の活用（たくない・たかった）とつなげる。"}, "lesson.N5-L16.memo.1": {"ja": "三人称の「ほしがる・たがる」はN4。本課は「他人に直接使わない」と注意するだけ。"}, "lesson.N5-L16.memo.2": {"ja": "「〜に 行く（目的）」の「に」は方向の「へ」、時間の「に」と区別させる。助詞の穴埋めで特に一問出す。"}, "lesson.N5-L16.memo.3": {"ja": "聴解（番外編）は蓮とエマがおじいさんのカメラについて話す。第2課「おじいさんの カメラです」の伏線を回収し、くれる・過去形も復習する。"}, "lesson.N5-L16.memo.4": {"ja": "時事：免税制度は「出国時に払い戻す」方式に変わる予定（2026年11月〜）。授業の際に最新の規定を確認すること。"}, "lesson.N5-L17.memo.0": {"ja": "数量詞は最もよく使う 枚・本・人・回・台 だけ。冊・匹・杯などは会話の中で「参考」として出す。"}, "lesson.N5-L17.memo.1": {"ja": "時点（に）と期間（に をつけない）の対比が重要。「日本に います」の「に」は存在の場所で、期間ではない。"}, "lesson.N5-L17.memo.2": {"ja": "郵便料金は2024年4月当時の70円（2024年10月からは100円）。学習者に今の料金を調べさせてもよい。"}, "lesson.N5-L17.memo.3": {"ja": "読解は雨晴から母への絵はがき（番外編）。第1〜17課の文法をすべて復習でき、旅の前半のふり返りにもなる。"}, "lesson.N5-L18.memo.0": {"ja": "て形はN5後半の核心。本課は作れることが目標で、以降の課で繰り返し使う。先生のN4第2・14単元に対応。"}, "lesson.N5-L18.memo.1": {"ja": "グループ1の5つの音便は表で整理。「行きます」の例外は必ず個別に強調する。"}, "lesson.N5-L18.memo.2": {"ja": "先生の構成は辞書形の語尾で判断する（う・つ・る→って）が、学習者はまだ辞書形を学んでいないので、ます形の前の音で判断する。第23課で辞書形を学ぶときにつなげる。"}, "lesson.N5-L18.memo.3": {"ja": "会話の「出て、右です」はまず聞いて理解するだけ。第21課で正式に学ぶ。"}, "lesson.N5-L19.memo.0": {"ja": "〜ています は本課では進行のみ。状態・習慣は第20課。先生のN4第3単元はこの2課に分かれる。"}, "lesson.N5-L19.memo.1": {"ja": "乗り物の助詞 で・に・を を対比表で整理。第10課の「バスが あります」も復習できる。"}, "lesson.N5-L19.memo.2": {"ja": "読解は雨晴の日記（番外編）。第19課までの文法のみ使用。"}, "lesson.N5-L19.memo.3": {"ja": "時事：京都のバスの混雑はオーバーツーリズムの実例。2024年6月から観光特急バスが運行。"}, "lesson.N5-L20.memo.0": {"ja": "先生のN4第16単元（てもいい・てはいけない）が本課に対応。第3単元の状態・習慣も本課。"}, "lesson.N5-L20.memo.1": {"ja": "「住む」は「に」、「働く」は「で」。よくある誤りなので穴埋めで練習。"}, "lesson.N5-L20.memo.2": {"ja": "知っています／知りません の非対称はエマの誤りを例に説明する。"}, "lesson.N5-L20.memo.3": {"ja": "三十三間堂の堂内は実際に撮影禁止。最新の規定を学習者に調べさせてもよい。冒頭の「1001体」は参考で、覚えなくてよい。"}, "lesson.N5-L21.memo.0": {"ja": "先生のN4第22単元（てから・前に・た後で）は第21・23・24課に分かれる。"}, "lesson.N5-L21.memo.1": {"ja": "〜て、〜て は最後の動詞だけが時制を表す。中国語と対照する。"}, "lesson.N5-L21.memo.2": {"ja": "「から」の用法が三つになるので対比表で整理する。"}, "lesson.N5-L21.memo.3": {"ja": "会話の「左を 上に して」は定型句扱い。浴衣の右前は亡くなった人の着方であることを説明する。読解はエマのブログ（番外編）。"}, "lesson.N5-L22.memo.0": {"ja": "ない形は第26課の普通形の基礎。先生の第21回（ません と ない）とN4第17・19単元に対応。"}, "lesson.N5-L22.memo.1": {"ja": "「なければ」の仕組み（仮定形）はN4第10課で学ぶ。本課は固定の文型として扱う。"}, "lesson.N5-L22.memo.2": {"ja": "買う→買わない の「わ」はよくある誤り。"}, "lesson.N5-L22.memo.3": {"ja": "大浴場のマナー（裸で入る、タオル、先に洗う）は旅行の重要ポイント。「までに」はN4第21課に回す。"}, "lesson.N5-L23.memo.0": {"ja": "辞書形を学んだので、第18課のて形の規則を先生の説明（う・つ・る→って）に置き換えてつなげる。先生のN4第8単元に対応。"}, "lesson.N5-L23.memo.1": {"ja": "前に と てから は同じ出来事で対比する（順序が逆）。「前に」の位置の用法（第10課）にも触れる。"}, "lesson.N5-L23.memo.2": {"ja": "可能形はN4第2課。本課は「ことが できます」を使う。"}, "lesson.N5-L23.memo.3": {"ja": "読解は蓮の自己紹介（番外編）で、第2課・第16課のおじいさんのカメラとつながる。雨晴の「絵が仕事になるか」はN4の伏線。"}, "lesson.N5-L24.memo.0": {"ja": "先生のN4第5・7単元が本課に対応。第22単元の「た後で」もここ。"}, "lesson.N5-L24.memo.1": {"ja": "〜て、〜て と 〜たり〜たり の違い（順序か例示か）を対比表で。"}, "lesson.N5-L24.memo.2": {"ja": "前に／てから／た あとで の動詞の形を表で一度に整理する。"}, "lesson.N5-L24.memo.3": {"ja": "会話の「飲みに 行ったり も します」は自然な口語として触れてもよい。聴解は柏宇と同僚・田中の失敗談。"}, "lesson.N5-L25.memo.0": {"ja": "先生の第18回（くなる・になる）とN4第31単元（ながら）が本課に対応。"}, "lesson.N5-L25.memo.1": {"ja": "雨晴の「絵を描く人になりたい」はN4でデザイナーになる伏線。会話中の名詞修飾はチャンクで示す。"}, "lesson.N5-L25.memo.2": {"ja": "ながら は主な動作を後ろに置く。中国語の「一邊～一邊～」とは異なる。"}, "lesson.N5-L25.memo.3": {"ja": "読解はベトナムの教え子グエンさんから美咲への手紙で、第15課とつながる。"}, "lesson.N5-L26.memo.0": {"ja": "先生の第21回（ません と ない）、第17回（動詞の活用）、N4第6単元が本課に対応。"}, "lesson.N5-L26.memo.1": {"ja": "〜ている の縮約（〜てる）や「〜たら」は本課では使わず、N4に回した。"}, "lesson.N5-L26.memo.2": {"ja": "普通形は次の課の「と思います」「と言いました」ですぐに使う、接続の基礎。"}, "lesson.N5-L26.memo.3": {"ja": "雨晴と柏宇の会話は第13・24課ではです・ますだが、ここから普通体にしてよい。N4からは普通体。"}, "lesson.N5-L27.memo.0": {"ja": "普通形の応用が本課から始まる。だ の有無（と思います は要る、でしょう は要らない）がよくある誤り。"}, "lesson.N5-L27.memo.1": {"ja": "先生のN4第27単元（でしょう・ましょう・意向形）のうち「でしょう」は本課、意向形はN4第8課。"}, "lesson.N5-L27.memo.2": {"ja": "中国語の「我不覺得」と日本語の否定の位置の違いを対照する。"}, "lesson.N5-L27.memo.3": {"ja": "読解は美咲の日記（番外編）で、初めて普通体の書き言葉が出る。"}, "lesson.N5-L28.memo.0": {"ja": "修飾節の主語は「が」、「の」を入れない。中国語話者に最も多い二つの誤り。"}, "lesson.N5-L28.memo.1": {"ja": "ので は本課では入門。N4第19課の丁寧な休みの願い出で再度使う。先生のN4第25単元に対応。"}, "lesson.N5-L28.memo.2": {"ja": "「かぶる」（帽子）「かける」（眼鏡）などの着脱の動詞は触れるだけで、整理はN4。"}, "lesson.N5-L28.memo.3": {"ja": "聴解（番外編）はエマと蓮のお別れパーティーの内緒の準備で、第30課への伏線。"}, "lesson.N5-L29.memo.0": {"ja": "当初の計画は台風だったが、4月の東京に台風はほぼ来ないので春の強風（春の嵐）に変更した。先生の第13回（で・原因）、第16回（予約・とき）、N4第9単元に対応。"}, "lesson.N5-L29.memo.1": {"ja": "辞書形＋とき／た形＋とき の前後関係は初級で最も混同しやすい。「台湾へ帰る」の例で対比する。"}, "lesson.N5-L29.memo.2": {"ja": "ホテルの表現は聞いてわかればよい。「何名様」は定型句扱いで、敬語はN4。"}, "lesson.N5-L29.memo.3": {"ja": "読解は柏宇のメール（番外編）で、会社がデザイナーを募集していること、N4の主な伏線。"}, "lesson.N5-L30.memo.0": {"ja": "N5のまとめ。5つの動詞の形と接続する文型の対照表がN5全体の総整理。先生の第17回の「ば形」「意向形」はここでは教えず、N4第8・10課へ移した（当初の「先に紹介する」案は、N5の練習範囲を超えないようにやめた）。"}, "lesson.N5-L30.memo.1": {"ja": "「いってらっしゃい／いってきます」は第1課、「あげます／くれます」は第11課とつながり、物語を感情的に締めくくる。"}, "lesson.N5-L30.memo.2": {"ja": "N4の始まり：柏宇の資料＋雨晴の絵 → 半年後、ワーキングホリデーのビザで東京に戻る。"}, "lesson.N5-L30.memo.3": {"ja": "聴解は雨晴の搭乗前の音声メッセージ（番外編）で、N5文法の総合聴解。"}, "lesson.N5-L12.extra.intro": {"ja": "番外編：同じ日の夕方、雨晴とエマはまだ谷中にいる。宿では美咲と蓮が猫のハナを探している。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L13.extra.intro": {"ja": "番外編：柏宇のブログ。雨晴が東京に来る1か月前に書いたもの。"}, "lesson.N5-L14.extra.intro": {"ja": "番外編：雨の日の午後、エマと美咲が、エマが今年1月に初めてひだまりハウスに来た日のことを話す。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L15.extra.intro": {"ja": "番外編：ひだまりハウスの玄関に置いてある紹介文。美咲が書いたもの。美咲は昔……？"}, "lesson.N5-L16.extra.intro": {"ja": "番外編：その夜、エマが蓮に、どうしていつもあの古いカメラを持っているのか聞く。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L17.extra.intro": {"ja": "番外編：雨晴が郵便局から出した絵はがき。美咲に「日本語で書いてみたら？」と言われ、雨晴は初めて日本語で母に手紙を書いた。"}, "lesson.N5-L18.extra.intro": {"ja": "番外編：京都に着いた雨晴のスマホに、美咲からの留守番電話。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L19.extra.intro": {"ja": "番外編：雨晴が旅館で書いた日記。美咲は毎日3行でいいと言ったが、今日はたくさん書いた。"}, "lesson.N5-L20.extra.intro": {"ja": "番外編：夜の旅館で、雨晴がエマの家族のことを聞く。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L21.extra.intro": {"ja": "番外編：エマが日本語の練習のためにブログに書いた旅行記。エマの日本語は上達した？"}, "lesson.N5-L22.extra.intro": {"ja": "番外編：同じ日、東京のハナは動物病院へ。美咲と蓮が獣医の説明を聞く。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L23.extra.intro": {"ja": "番外編：蓮が大学の写真サークルのサイトに書いた自己紹介。"}, "lesson.N5-L24.extra.intro": {"ja": "番外編：東京の会社で、柏宇が先輩の田中と話す。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L25.extra.intro": {"ja": "番外編：第15課に出たベトナムの教え子グエンさんは、毎年美咲に手紙を書く。今年の手紙。"}, "lesson.N5-L26.extra.intro": {"ja": "番外編：蓮が北海道のおじいさん（第16課）に電話する。家族の普通体を聞いてみよう。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L27.extra.intro": {"ja": "番外編：美咲の日記。日記はふつう普通体で書く。美咲は雨晴をどう思っている？"}, "lesson.N5-L28.extra.intro": {"ja": "番外編：雨晴の外出中、エマと蓮が台所でこっそり相談する。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "lesson.N5-L29.extra.intro": {"ja": "番外編：柏宇から雨晴へのメール。練習のために日本語で書いている。"}, "lesson.N5-L30.extra.intro": {"ja": "番外編：搭乗の前に、雨晴がひだまりハウスのみんなに録音したメッセージ。スクリプトを見ないで、まず全部聞いてから問題に答えよう。"}, "design.body": {"ja": "\n<div class=\"intro\"><h1>設計について<\/h1><p>このページでは、コースの設計方針と、アプリに実装する際の主な仕組み（文法チェック、文法の固定ID、挿絵、音声、AI会話、データベース）を説明します。<\/p><\/div>\n<h2>各課の構成<\/h2>\n<ol><li><b>場面<\/b>：同じ時代・同じ世界（2024年春の東京）。各課に日付・場所・登場人物を示し、物語が続いていきます。<\/li>\n<li><b>会話<\/b>：物語の本体。各文に、使っている既習文法（青いタグ、押すとその課へ移動）と、先に丸ごと覚える定型表現（ピンクのタグ）を表示します。<\/li>\n<li><b>単語<\/b>：生活・旅行でよく使う語。場面ごとに分類し、例文つき。<\/li>\n<li><b>文法<\/b>：「文法系統」の先生の構成にならい、文型 → 例文 → ポイント（繁体字の説明＝なぜそうなるか）→ ⚠️注意 → 既習文法との比較表 → 中国語との比較 → 発展（参考）の順に示します。<\/li>\n<li><b>練習<\/b>：選択・穴埋め・並べ替え（★）に加え、絵を見て答える問題、聞き取り、二択の小問、文作り、中国語→日本語作文、毎課の助詞の総合穴埋めがあります。<\/li>\n<li><b>AI会話<\/b>：タスク型ロールプレイ。AIは既習の文法だけを使います。<\/li>\n<li><b>メモ・検討事項<\/b>：先生・編集者向け。今後の課で繰り返し練習すべき点を記録します。<\/li><\/ol>\n<h2>文法項目のID<\/h2>\n<p>文法項目には課番号を含まない固定IDをつけています（例：<code>n5-te-kudasai<\/code>、<code>n5-arimasu-imasu<\/code>）。課の順番を入れ替えてもIDは変わらず、「何課の何番目か」は別の欄に記録します。アプリ上の解答記録や復習リンクが、コース調整後に別の文法を指してしまうことを防ぐためです。<\/p>\n<h2>「既習の文法だけを使う」ための仕組み<\/h2>\n<p>原稿 <code>tools/src/n5_course.py<\/code> には自動チェックがあり、会話・例文・練習の参考解答をすべて「後の課で教える文法」の一覧と照合します（例：第10課の会話に第18課で学ぶ「〜てください」が出たらエラー）。定型表現は明示的に印をつけたものだけ許可します。現在、第1〜30課はすべて通過しています。第12課からは、会話のほかに聴解（偶数課）と読解（奇数課）を交互に入れ、登場人物の番外編（日記・手紙・ブログ・昔の話）で既習文法を復習します。<\/p>\n<h2>挿絵<\/h2>\n<ol><li>ChatGPTの契約（Codex経由）で画像を生成しています。APIキーの追加料金は不要です。<\/li>\n<li>まず登場人物ごとに設定画（全身＋表情3種）を作り、挿絵を描くときにその設定画を参照画像として渡すので、キャラクターの見た目が統一されます。<\/li>\n<li>すべての画像に同じ画風の指定（アニメ調・セル塗り・春の暖かい色）を使い、「画像の中に文字を入れない」ように指定しています。画像生成モデルが書く日本語は間違いが多いため、文字はアプリ側で重ねます。<\/li><\/ol>\n<h2>音声<\/h2>\n<p>ElevenLabsで、登場人物ごとに固定の声を割り当てています（雨晴・美咲・蓮・エマ・柏宇、ナレーション、通行人2種、文章朗読）。初級者向けに話す速さを0.9倍にしています。単語は漢字の読み間違いを防ぐため、かなで読ませています。会話は「▶ 全部聞く」で一続きに聞けます。<\/p>\n<h2>AI会話をアプリでどう使うか<\/h2>\n<ul><li>各課の <code>ai_roleplay<\/code> に、場面・AIの役・課題・合格条件・ヒント・最初のセリフ・システムプロンプトが入っています。<\/li>\n<li>システムプロンプトにはその課までの既習文法を列挙し、AIにその文法だけで、1回1〜2文、漢字に読みがなをつけ、中国語訳を添えて話すよう指示しています。学習者が間違えたら💡で1行指摘します。<\/li>\n<li>合格条件を満たしたら、AIが中国語で3行のフィードバックを出します。<\/li><\/ul>\n<h2>データベース<\/h2>\n<p>コースの内容・音声・画像はSupabaseに保存しています（<code>jp<\/code> スキーマ。旧アプリの <code>public<\/code> のテーブルはそのまま）。このページはSupabaseからデータを読み込んで表示しています。<\/p>\n<h2>「文法系統/N5」の22単元が何課に入っているか<\/h2>\n<p>課の順番は『みんなの日本語』『新版標準日本語』を参考にしましたが、そのままではなく旅行で必要な順に調整しています。22単元の内容はすべて含まれています（原稿が漏れを自動チェックします）。<\/p>\n<h2>『みんなの日本語』との主な違い<\/h2>\n<ul><li>30課構成にし、1課あたりの文法項目を2〜5個にしました（『みんなの日本語』の前半は1課5〜6個のことが多い）。<\/li>\n<li>「〜をください」を第4課に：旅行2日目にはもう買い物をするので、動詞を学び終えるのを待たない。<\/li>\n<li>「〜ましょうか（申し出）」を「〜ませんか・〜ましょう」と同じ第8課に：3つの違いは「だれがするか、だれのためか」だけなので。<\/li>\n<li>「あげます・もらいます」を第11課として独立（お土産を渡す場面）。形容詞の過去形と比較も2つの課に分けました。<\/li>\n<li>「〜てください」のて形は第18課（京都駅で人に助けを頼む場面）。それまでの課でお願いが必要なときは「〜をください」「もういちど おねがいします」などの定型表現を使います。<\/li><\/ul>\n{{units}}\n<h2>注意点<\/h2>\n<div class=\"flag\">第17回の「仮定形（ば）」「意向形」はN4の範囲なので、N4の第8・10課に移しました。N5では教えません。<\/div>\n<div class=\"flag\">第13回の「で（原因）」は『みんなの日本語』では後半の内容なので、第29課（春の強風で飛行機の時間が変わる場面）に入れました。<\/div>\n<div class=\"flag\">第1課の「〜は どこですか」「これは いくらですか」には第2〜4課で学ぶ「これ・どこ・いくら」が含まれるため、定型表現として丸ごと覚える扱いにしています。<\/div>\n", "zh": "\n<div class=\"intro\"><h1>設計說明<\/h1><p>這一頁說明課程怎麼設計，以及 app 實作時要接的幾個部分：文法檢查、文法點的固定 ID、插畫、聲音、AI 會話、資料庫。<\/p><\/div>\n<h2>每課的結構<\/h2>\n<ol><li><b>情境<\/b>：同一個時空（2024 年春天的東京），每課標日期、地點、出場角色，故事會接下去。<\/li>\n<li><b>會話<\/b>：故事主體。每句標出用到的舊文法（藍色，點了會跳到那一課），以及先整句背的定型句（粉紅）。<\/li>\n<li><b>單字<\/b>：生活、旅行用字，依情境分類，附例句。<\/li>\n<li><b>文法<\/b>：照「文法系統」老師的編排：句型 → 例句 → ポイント（繁體說明「為什麼」）→ ⚠️ 注意 → 和舊文法的比較表 → 和中文比較 → 發展（參考）。<\/li>\n<li><b>練習<\/b>：選擇、填空、★排序，再加上看圖選擇、聽力、二選一小題、造句、中翻日、每課的綜合助詞填空。<\/li>\n<li><b>AI 會話<\/b>：任務型角色扮演，AI 只能用學過的文法。<\/li>\n<li><b>メモ・検討事項<\/b>：給老師和編輯看，記下之後幾課要反覆練習的地方。<\/li><\/ol>\n<h2>文法點的 ID<\/h2>\n<p>每個文法點有固定 ID，用文法本身命名（例如 <code>n5-te-kudasai<\/code>、<code>n5-arimasu-imasu<\/code>），不含課號。課程怎麼重排，ID 都不會變；「在第幾課」另外記在課號和順序欄位。這樣 app 上的作答紀錄、複習連結不會因為調整課程而指到錯的文法。<\/p>\n<h2>「學過才用」怎麼保證<\/h2>\n<p>原稿 <code>tools/src/n5_course.py<\/code> 內建檢查：每一句會話、例句、練習的參考答案都會比對「之後才教的文法」清單。定型句要明確標記才會放行。目前第 1～30 課全部通過。第 12 課起，除了會話之外交錯加入聽力（偶數課）和閱讀（奇數課），內容是登場人物的番外篇（日記、信、部落格、過去的故事），用學過的文法複習。<\/p>\n<h2>插畫<\/h2>\n<ol><li>用 ChatGPT 訂閱（透過 Codex）生圖，不需要另外付 API 費用。<\/li>\n<li>先畫每個角色的設定圖（全身＋三種表情），畫課程插畫時把設定圖當參考圖一起送出，角色長相才會一致。<\/li>\n<li>所有圖都用同一段畫風描述（日式動畫風、賽璐璐上色、春天暖色調），並要求「圖中不要有文字」，因為圖像模型寫的日文常常是錯的；需要文字的地方由 app 疊上去。<\/li><\/ol>\n<h2>聲音<\/h2>\n<p>用 ElevenLabs 幫每個角色固定一個聲音（雨晴、美咲、蓮、艾瑪、柏宇、旁白、兩種路人、文章朗讀），語速調成 0.9 倍給初學者。單字為了避免漢字念錯，改用假名念。會話可以按「▶ 整段播放」一次聽完。<\/p>\n<h2>AI 會話：在 app 上怎麼接<\/h2>\n<ul><li>每課的 <code>ai_roleplay<\/code> 有：情境、AI 角色、任務、過關條件、提示、開場白，以及組好的 system prompt。<\/li>\n<li>system prompt 列出到這一課為止學過的文法，要求 AI 只用這些文法、每次 1～2 句、漢字附假名、附中文翻譯，學習者說錯時用一行 💡 提醒。<\/li>\n<li>達成過關條件後，AI 用中文給三行回饋。<\/li><\/ul>\n<h2>資料庫<\/h2>\n<p>課程內容、音檔、圖片都放在 Supabase（<code>jp<\/code> schema；舊 app 的 <code>public<\/code> 資料表不動），這個網頁是從 Supabase 讀資料顯示的。<\/p>\n<h2>「文法系統/N5」22 個單元在哪裡學到<\/h2>\n<p>課程順序參考《大家的日本語》《新標日》，不完全照抄，而是依旅遊需求調整，22 個單元內容都已經排進去（原稿會自動檢查有沒有漏掉）。<\/p>\n<h2>和大家的日本語不一樣的地方<\/h2>\n<ul><li>擴充成 30 課，每課 2～5 個文法點（大家的日本語前 25 課常常一課 5～6 個）。<\/li>\n<li>「〜をください」放在第 4 課：旅行第二天就要買東西，不用等到學完動詞。<\/li>\n<li>「〜ましょうか（我來幫你）」和「〜ませんか・〜ましょう」一起放在第 8 課，因為三個只差在誰做、為誰做。<\/li>\n<li>「あげます・もらいます」獨立成第 11 課（送伴手禮），形容詞過去式和比較句也拆成兩課。<\/li>\n<li>「〜てください」所在的て形放在第 18 課，搭配「京都車站請人幫忙」的情境；之前的課如果需要請求，就用「〜をください」或「もういちど おねがいします」這種定型句。<\/li><\/ul>\n{{units}}\n<h2>需要注意的地方<\/h2>\n<div class=\"flag\">第 17 回的「仮定形（ば）」「意向形」屬於 N4 範圍，移到 N4 第 8、10 課教，N5 不教。<\/div>\n<div class=\"flag\">第 13 回「で（原因）」在大家的日本語屬於較後面的內容，放在第 29 課，搭配「春季強風造成班機改時間」的情境。<\/div>\n<div class=\"flag\">第 1 課的「〜は どこですか」「これは いくらですか」用到第 2～4 課才教的これ・どこ・いくら，先標成定型句整句背。<\/div>\n"}};       // 設計理念、背景說明的中文／日文
let lang = "zh";
try { lang = localStorage.getItem("lang") === "ja" ? "ja" : "zh" } catch (e) {}
// 說明文字：日文模式時優先用日文，沒有日文就顯示中文
function t(key, zh) {
  const db = (DATA && DATA.texts) || {}, st = TEXTS[key] || {}, d = db[key] || {};
  if (lang === "ja") return d.ja || st.ja || zh || d.zh || st.zh || "";
  return zh || d.zh || st.zh || "";
}
const UI = {
  "nav.n4": ["N4 規劃", "N4の計画"], "nav.map": ["課程地圖", "コース一覧"], "nav.world": ["角色與世界觀", "登場人物と世界観"], "nav.design": ["設計說明", "設計について"],
  "logo.sub": ["N5 旅行篇・課程規劃", "N5 旅行編・コース設計"], "story": ["故事線", "ストーリー"],
  "world.timeline": ["N5 → N1 的故事線", "N5 → N1 のストーリー"], "world.chars": ["登場角色", "登場人物"], "world.places": ["場景", "舞台"],
  "lbl.speech": ["說話方式", "話し方"], "lbl.arc": ["之後的故事", "今後の物語"], "lbl.topics": ["時事題材：", "時事の題材："],
  "legend.detailed": ["已完成詳細內容（第 1～30 課）", "詳細あり（第1〜30課）"], "legend.outline": ["大綱（文法＋情境）", "概要（文法と場面）"],
  "legend.units": ["涵蓋「文法系統/N5」第幾回", "「文法系統/N5」の何回を扱うか"],
  "memo.for": ["給老師／編輯", "先生・編集者向け"], "outline.note": ["詳細內容（會話、單字、練習、AI 會話）確認樣本後再量產。", "詳細（会話・単語・練習・AI会話）は、サンプル確認後に作成します。"],
  "playall": ["▶ 整段播放", "▶ 全部聞く"], "stop": ["■ 停止", "■ 停止"],
};
const ui = k => (UI[k] || [k, k])[lang === "ja" ? 1 : 0];
const SB = path => REMOTE ? `${REMOTE.url}/storage/v1/object/public/${path}` : path;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ruby = s => esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
const kana = s => String(s ?? "").replace(/\{([^|{}]+)\|([^{}]+)\}/g, "$2");
let CH = {}, GID = {}, HAS = new Set();
function initData() {
  CH = Object.fromEntries(DATA.world.characters.map(c => [c.id, c]));
  GID = {}; DATA.plan.forEach(l => l.grammar.forEach(g => GID[g.id] = { ...g, lesson: l.id, no: l.no }));
  HAS = new Set(DATA.images || []);
}
const COLORS = { yuqing: "#e0a12a", misaki: "#3d5aa8", ren: "#5d7a3a", emma: "#d8577a", boyu: "#36809a", hana: "#b8743a" };
const SPK = { "雨晴": "yuqing", "美咲": "misaki", "蓮": "ren", "エマ": "emma", "柏宇": "boyu" };
const EMOJI = {
  "L01-cover": "🧳🏠", "L01-morning": "☀️🧹", "L01-night": "🌙🛏️", "L01-water": "💧💴", "L01-confused": "💬❓",
  "L02-cover": "🍞☕🐈", "L02-card-fish": "🐈🐟", "L02-card-rice": "👩🍚", "L02-card-milk": "🐈🥛", "L02-card-photo": "🧑📷",
  "L02-card-book": "🐈📖👓", "L02-card-buy": "🏪☕", "L10-cover": "🗺️🚲📱", "L10-chopsticks": "🍜🥢", "L10-pay": "📱🚉",
  "L10-camera": "📷⛩️", "L10-confused": "❓🚃🚌"
};
const imgUrl = id => !HAS.has(id) ? null : REMOTE ? SB(`course-images/web/${id}.jpg`) : `img/${id}.jpg`;
let furigana = true;
try { furigana = localStorage.getItem("furi") !== "0" } catch (e) {}

function av(id, size) {
  const c = CH[id]; if (!c) return "";
  const ch = (c.name_kanji || c.name_jp).trim().slice(0, 1);
  const u = imgUrl("char-" + id);
  if (u) return `<span class="${size || "av"}" style="background:${COLORS[id]} url(${u}) 88% 9% / 290% auto no-repeat" aria-hidden="true"></span>`;
  return `<span class="${size || "av"}" style="background:${COLORS[id]}" aria-hidden="true">${esc(ch)}</span>`;
}
function charChip(id) { const c = CH[id]; return c ? `<span class="chip">${av(id)}${esc(c.name_zh)}</span>` : ""; }
let player = null, playing = null, CUR = null;
// 整段播放：依序播每一句（有音檔用角色聲音，沒有就用瀏覽器語音），目前這句會反白
function playAll(kind) {
  const btn = $("[data-playall]");
  if (playing) { playing.stop = true; if (player) player.pause(); speechSynthesis && speechSynthesis.cancel(); playing = null; btn.textContent = ui("playall"); document.querySelectorAll(".ln.now").forEach(x => x.classList.remove("now")); return }
  const les = DATA.lessons[CUR];
  const mode = kind || btn.dataset.playall;
  const lines = mode === "listen" ? les.listening.script : mode === "read" ? [{ jp: `reading:${les.id}` }] : les.conversation.lines;
  lines.slice(0, 2).forEach(l => clip(l.jp));
  const run = { stop: false }; playing = run; btn.textContent = ui("stop");
  (async () => {
    for (let i = 0; i < lines.length && !run.stop; i++) {
      const l = lines[i], el = document.querySelector(`[data-line="${i}"]`);
      if (l.speaker === "ハナ") continue;
      document.querySelectorAll(".ln.now").forEach(x => x.classList.remove("now"));

      if (lines[i + 1]) clip(lines[i + 1].jp);  // 先載入下一句，銜接才不會等網路
      await say(l.jp);

const CLIPS = {};
function clip(text) {
  const raw = (DATA.audio || {})[text]; if (!raw) return null;
  const url = REMOTE ? SB(raw) : raw;
  if (!CLIPS[url]) { CLIPS[url] = new Audio(url); CLIPS[url].preload = "auto" }
  return CLIPS[url];
}
function say(text) {
  const a = clip(text);
  if (a) {  // ElevenLabs 角色聲音
    if (player) player.pause();
    player = a; player.currentTime = 0;
    return new Promise(res => { player.onended = res; player.onerror = res; player.play().catch(res) });
  }
  if (!("speechSynthesis" in window)) return Promise.resolve();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(kana(text).replace(/[（(].*?[）)]/g, ""));
  u.lang = "ja-JP"; u.rate = .85;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ja")); if (v) u.voice = v;
  return new Promise(res => { u.onend = res; u.onerror = res; speechSynthesis.speak(u) });
}
function copyText(btn, text) {
  const done = () => { const t = btn.textContent; btn.textContent = "已複製"; setTimeout(() => btn.textContent = t, 1200) };
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)) } catch (e) { fallbackCopy(text, done) }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
  try { document.execCommand("copy"); done() } catch (e) {} ta.remove();
}

    } else if (q.type === "multi_choice") {

    } else if (q.type === "particle_fill") {
      ctl = `<div class="mini pf">${q.items.map((it, j) => { let k = 0; return `<div class="row" data-item="${j}"><span>${j + 1}. ${ruby(it.text).replace(/（　）/g, () => `（<select data-blank="${k++}"><option value="">　</option>${q.options.map(o => `<option>${o}</option>`).join("")}</select>）`)}</span><span class="why" hidden>${esc(it.why)}</span></div>` }).join("")}</div>
        <div><button class="act" data-check>檢查</button></div>`;

function bindEx(les) {
  const done = new Set(), right = new Set();
  const upd = () => $("#score").textContent = `答對 ${right.size} / ${les.exercises.length}${done.size === les.exercises.length ? (right.size === les.exercises.length ? "　全對！ピンポーン！" : "　可以再試一次錯的題目") : ""}`;
  document.querySelectorAll(".q").forEach(el => {
    const i = +el.dataset.q, q = les.exercises[i], ex = $("[data-expl]", el);
    const show = ok => { done.add(i); ok ? right.add(i) : right.delete(i); ex.innerHTML = `<div class="expl ${ok ? "" : "ng"}">${ok ? "⭕ 正確！" : "❌ 再想想。"} ${ruby(q.explanation_zh)}</div>`; upd() };
    if (q.type === "multi_choice") {
      const got = {};
      el.addEventListener("click", e => {
        const b = e.target.closest("[data-mopt]"); if (!b) return;
        const row = b.closest("[data-item]"), it = q.items[+row.dataset.item], ok = +b.dataset.mopt === it.answer;
        b.classList.add(ok ? "ok" : "ng");
        if (ok) { row.querySelectorAll("[data-mopt]").forEach(x => x.disabled = true); const w = $(".why", row); if (w) w.hidden = false }
        if (!(row.dataset.item in got)) got[row.dataset.item] = ok;
        if (Object.keys(got).length === q.items.length) show(Object.values(got).every(Boolean));
      });
      return;
    }
    if (q.type === "compose" || q.type === "translate") {
      el.addEventListener("click", e => {
        if (!e.target.closest("[data-reveal]")) return;
        el.querySelectorAll(".reveal").forEach(r => r.hidden = false);
        done.add(i); right.add(i); ex.innerHTML = `<div class="expl">✍️ 對照參考答案自己檢查。${ruby(q.explanation_zh)}</div>`; upd();
      });
      return;
    }
    if (q.type === "particle_fill") {
      el.addEventListener("click", e => {
        if (!e.target.closest("[data-check]")) return;
        let all = true;
        el.querySelectorAll("[data-item]").forEach(row => {
          const it = q.items[+row.dataset.item];
          row.querySelectorAll("select").forEach(sel => {
            const ok = it.answers[+sel.dataset.blank].includes(sel.value);
            sel.classList.toggle("ok", ok); sel.classList.toggle("ng", !ok); if (!ok) all = false;
          });
          $(".why", row).hidden = false;
        });
        show(all);
      });
      return;
    }
    if (q.type === "card_builder" || q.type === "sentence_order") {
      const slots = $("[data-slots]", el); let picked = [];
      const draw = () => {
        slots.innerHTML = picked.map(j => `<span class="card">${ruby((q.cards || q.options)[j])}</span>`).join("");
        el.querySelectorAll("[data-card]").forEach(b => b.classList.toggle("used", picked.includes(+b.dataset.card)));
      };
      el.addEventListener("click", e => {
        const c = e.target.closest("[data-card]");
        if (c && !picked.includes(+c.dataset.card)) { picked.push(+c.dataset.card); draw() }
        if (e.target.closest("[data-reset]")) { picked = []; draw(); ex.innerHTML = "" }
        if (e.target.closest("[data-check]")) {
          if (q.type === "card_builder") show(picked.map(j => q.cards[j]).join("|") === q.answer.join("|"));
          else show(picked.join() === q.order.map(n => n - 1).join());
        }
      });
    } else {
      el.addEventListener("click", e => {
        const b = e.target.closest("[data-opt]"); if (!b) return;
        const ok = +b.dataset.opt === q.answer;
        b.classList.add(ok ? "ok" : "ng");
        if (ok) el.querySelectorAll("[data-opt]").forEach(x => x.disabled = true);
        show(ok);
      });
    }
  });
}

    </div>

      <div class="chat" id="chat"><div class="msg ai">${esc(r.opening_line)}</div></div>

      <div class="score" id="ai-note">正在連線 AI…</div>
    </div></div>`;
}
function bindAI(les) {
  const r = les.ai_roleplay, chat = $("#chat"), form = $("#composer"), input = $("#ai-input"), note = $("#ai-note"), send = $("#ai-send");
  $("[data-copytext]")?.addEventListener("click", e => copyText(e.target, r.system_prompt));
  const turns = [{ role: "user", content: r.system_prompt + "\n\n（你的開場白已經顯示給學習者，接下來請回應學習者。）" }, { role: "assistant", content: r.opening_line }];
  const add = (cls, text) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; chat.append(d); chat.scrollTop = chat.scrollHeight; return d };
  let sample = null;
  samplePromise.then(s => {
    sample = s;
    if (s) note.textContent = "AI 會照「已學文法」回應你。第一次送出時會詢問是否允許使用 Claude。";
    else { note.textContent = "這個預覽沒有連上 AI。用 claude.ai 開這個頁面就能真的對話；在你的 app 裡，把左邊的 system prompt 接到你選的 LLM 即可。"; input.disabled = send.disabled = true }
  });
  form.onsubmit = async e => {
    e.preventDefault();
    const text = input.value.trim(); if (!text || !sample) return;
    input.value = ""; add("you", text); turns.push({ role: "user", content: text });
    const bubble = add("ai", "……"); send.disabled = true;
    try {
      const { text: reply } = await sample(turns, { modelTier: "quick", cache: false, onText: ({ text }) => { bubble.textContent = text; chat.scrollTop = chat.scrollHeight } });
      bubble.textContent = reply; turns.push({ role: "assistant", content: reply });
    } catch (err) {
      bubble.remove(); turns.pop();
      const msg = { not_granted: "你沒有允許這個頁面使用 Claude，AI 會話已關閉。", sampling_disabled: "這個帳號不能使用 Claude。", rate_limited: "使用太頻繁了，請稍後再試。" }[err.code] || "AI 沒有回應，請再送一次。";
      add("sys", msg);
      if (err.code === "not_granted" || err.code === "sampling_disabled") input.disabled = send.disabled = true;
    } finally { if (!input.disabled) send.disabled = false }
  };
}

function route() {

}
