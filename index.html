"2.19", "2.25"], "words": [], "outline_ja": "看板店の山本を訪ねる。気難しいと思っていたが、予想外の一面を見る。", "extra_ja": "老舗を紹介する番組", "grammar_titles": ["だけ／だけあって／だけに／だけのことはある", "にしては", "わりに（は）", "からして", "げ"]}, {"id": "N2-L05", "no": 5, "chapter": "C1", "title": "文字の歴史", "when": "2026年7月", "place": "解說文", "outline_zh": "解說：日本招牌字體的歷史，依據什麼發展出來。", "extra_zh": "", "grammar": ["2.108", "2.144", "2.100", "2.114", "2.140"], "words": [], "outline_ja": "解説：看板文字の歴史。何に基づいて発展してきたのか。", "extra_ja": "", "grammar_titles": ["に基づいて／に基づき", "をもとに（して）", "に沿って／に沿い", "のもとで／のもとに", "を通じて／を通して"]}, {"id": "N2-L06", "no": 6, "chapter": "C1", "title": "ご協力いただけませんか", "when": "2026年8月", "place": "商店街", "outline_zh": "正式請店家協助，高階敬語的攻防。", "extra_zh": "聽力短文：自治會的協力請求", "grammar": ["2.146", "2.147", "2.148", "2.149", "2.150"], "words": [], "outline_ja": "店に正式に協力を依頼する。高度な敬語のやりとり。", "extra_ja": "自治会からの協力依頼", "grammar_titles": ["お・ご〜願えませんか", "お・ご〜申し上げる", "（さ）せていただけませんか", "（さ）せてやっていただけませんか", "ていただけるとありがたいんですが"]}, {"id": "N2-L07", "no": 7, "chapter": "C1", "title": "誰のための町か", "when": "2026年9月", "place": "評論", "outline_zh": "評論：不分老少的街道設計，不只是外觀的問題。", "extra_zh": "", "grammar": ["2.109", "2.141", "2.83", "2.86", "2.113", "2.115"], "words": [], "outline_ja": "評論：年齢を問わない街のデザインは、外観だけの問題ではない。", "extra_ja": "", "grammar_titles": ["にわたって／にわたり", "を問わず／は問わず", "に（は）かかわらず／に（は）かかわりなく", "に限らず", "のみならず", "ばかりか"]}, {"id": "N2-L08", "no": 8, "chapter": "C1", "title": "やらざるを得ない", "when": "2026年10月", "place": "デザイン会社", "outline_zh": "小野不聽話，預算被砍，只好硬著頭皮做。", "extra_zh": "聽力短文：上班族的一段自述", "grammar": ["2.33", "2.121", "2.15", "2.53", "2.54", "2.37"], "words": [], "outline_ja": "小野が話を聞かず、予算も削られ、やらざるを得ない。", "extra_ja": "会社員の独白", "grammar_titles": ["ざるを得ない", "ほか（は）ない／よりほか（は）ない／ほかしかたがない", "かねる／かねない", "てはいられない", "てばかりはいられない／てばかりもいられない", "ずにはいられない／ないではいられない"]}, {"id": "N2-L09", "no": 9, "chapter": "C2", "title": "悩んだ末に", "when": "2026年11月", "place": "人物報導", "outline_zh": "報導：一位經營者煩惱到最後，決定關店的經過。", "extra_zh": "", "grammar": ["2.35", "2.1", "2.40", "2.55", "2.8", "2.10"], "words": [], "outline_ja": "人物報道：悩んだ末に閉店を決めた経営者の話。", "extra_ja": "", "grammar_titles": ["末（に）", "あげく（に）", "たところ", "てはじめて", "がきっかけで／がきっかけになって／をきっかけに（して）／をきっかけとして", "が契機で／が契機になって／を契機に（して）／を契機として"]}, {"id": "N2-L10", "no": 10, "chapter": "C2", "title": "忘れるところだった", "when": "2026年11月", "place": "商店街", "outline_zh": "差點搞砸說明會，趁出差順便補救，大家都累得快感冒。", "extra_zh": "聽力短文：生活小失敗的分享", "grammar": ["2.66", "2.44", "2.48", "2.49", "2.12", "2.23"], "words": [], "outline_ja": "説明会で失敗しかけ、出張のついでに立て直す。みんなも疲れて風邪気味。", "extra_ja": "日常の小さな失敗談", "grammar_titles": ["ところだった", "ついでに", "っぱなし", "っぽい", "がちだ", "気味"]}, {"id": "N2-L11", "no": 11, "chapter": "C2", "title": "伝統にほかならない", "when": "2026年12月", "place": "論說文", "outline_zh": "論說：所謂傳統不過是什麼？並不是舊的就好。", "extra_zh": "", "grammar": ["2.106", "2.98", "2.59", "2.60", "2.73", "2.62"], "words": [], "outline_ja": "論説：伝統とは何か。古ければいいというものではない。", "extra_ja": "", "grammar_titles": ["にほかならない", "に過ぎない", "というものだ", "というものではない／というものでもない", "とは限らない", "といっても過言ではない／といっても言い過ぎではない"]}, {"id": "N2-L12", "no": 12, "chapter": "C2", "title": "反対に決まっている", "when": "2027年1月", "place": "山本の店", "outline_zh": "山本明確反對。雨晴和他爭論，也聽見不是全無可能的回答。", "extra_zh": "聽力短文：地方新聞的居民聲音", "grammar": ["2.89", "2.99", "2.126", "2.76", "2.77", "2.79"], "words": [], "outline_ja": "山本がはっきり反対する。言い合いの末、可能性がないわけではないという答えを聞く。", "extra_ja": "地方ニュースの住民の声", "grammar_titles": ["に決まっている", "に相違ない", "ものか／もんか", "ないことはない／ないこともない", "ないではない／ないでもない", "なくはない／なくもない"]}, {"id": "N2-L13", "no": 13, "chapter": "C2", "title": "引き受けた以上", "when": "2027年2月", "place": "專欄", "outline_zh": "專欄：既然接下就要做到底，雖說如此也不代表要獨撐。", "extra_zh": "", "grammar": ["2.3", "2.21", "2.4", "2.20", "2.18", "2.26"], "words": [], "outline_ja": "コラム：引き受けた以上やり抜く。だからといって一人で抱えることはない。", "extra_ja": "", "grammar_titles": ["以上（は）", "からには／からは", "上は", "からといって", "からこそ", "ことから"]}, {"id": "N2-L14", "no": 14, "chapter": "C2", "title": "忙しいものだから", "when": "2027年3月", "place": "デザイン会社", "outline_zh": "小野出包的理由，雨晴因想幫忙過頭而適得其反。", "extra_zh": "聽力短文：道歉與辯解的留言", "grammar": ["2.128", "2.27", "2.38", "2.2", "2.130"], "words": [], "outline_ja": "小野のミスの理由と、手伝いすぎて逆効果になった雨晴。", "extra_ja": "謝罪と言い訳の留守電", "grammar_titles": ["ものだから", "ことだから", "たいばかりに／ほしいばかりに", "あまり（に）", "ものなら"]}, {"id": "N2-L15", "no": 15, "chapter": "C2", "title": "声に応えて", "when": "2027年4月", "place": "活動報告", "outline_zh": "報告：應居民要求調整計畫，不只招牌，連動線也重新討論。", "extra_zh": "", "grammar": ["2.82", "2.91", "2.90", "2.119", "2.143", "2.138"], "words": [], "outline_ja": "活動報告：住民の声に応えて計画を見直し、看板に加えて動線も議論する。", "extra_ja": "", "grammar_titles": ["に応じて（は）／に応じ", "に応えて／に応え", "に加えて／に加え", "はもちろん／はもとより", "をめぐって／をめぐり", "をかねて"]}, {"id": "N2-L16", "no": 16, "chapter": "C2", "title": "それどころではない", "when": "2027年5月", "place": "商店街", "outline_zh": "颱風損壞店面。別說招牌了，不先修好什麼都談不了。", "extra_zh": "聽力短文：災後的廣播", "grammar": ["2.65", "2.67", "2.74", "2.75", "2.9"], "words": [], "outline_ja": "台風で店が壊れる。看板どころではなく、直さないことには話にならない。", "extra_ja": "災害後の放送", "grammar_titles": ["どころか", "どころではない", "ない限り", "ないことには", "限り（は）／限りでは"]}, {"id": "N2-L17", "no": 17, "chapter": "C2", "title": "便利さの裏側", "when": "2027年6月", "place": "評論", "outline_zh": "評論：數位招牌方便的另一面；姑且不論費用，少了人味就另當別論。", "extra_zh": "", "grammar": ["2.120", "2.110", "2.142", "2.117", "2.118", "2.80"], "words": [], "outline_ja": "評論：デジタル看板の便利さの裏側。費用はともかく、人の温かみは別の問題だ。", "extra_ja": "", "grammar_titles": ["反面／半面", "抜きで／抜きに／を抜きにして／は抜きにして", "を除いて（は）／を除き", "はともかく（として）", "は別として", "ならともかく"]}, {"id": "N2-L18", "no": 18, "chapter": "C3", "title": "こんな時に限って", "when": "2027年7月", "place": "デザイン会社", "outline_zh": "偏偏在發表前出事。若論字體，沒人比山本在行。", "extra_zh": "聽力短文：同事之間的抱怨", "grammar": ["2.85", "2.87", "2.88", "2.95", "2.97"], "words": [], "outline_ja": "発表前に限ってトラブル。字体にかけては山本の右に出る者はいない。", "extra_ja": "同僚同士の愚痴", "grammar_titles": ["に限って／に限り", "に限る", "にかけては／にかけても", "にしたら／にすれば／にしても", "にしろ／にせよ／にしても"]}, {"id": "N2-L19", "no": 19, "chapter": "C3", "title": "心に残るものがある", "when": "2027年8月", "place": "書評", "outline_zh": "書評：一本談設計的書，什麼才是應有的態度。", "extra_zh": "", "grammar": ["2.6", "2.127", "2.129", "2.124", "2.52", "2.84"], "words": [], "outline_ja": "書評：デザインを語る本。あるべき態度とは何か。", "extra_ja": "", "grammar_titles": ["得る／得ない", "ものがある", "ものではない", "も当然だ", "（の）ではあるまいか", "にかかわる"]}, {"id": "N2-L20", "no": 20, "chapter": "C3", "title": "言ったところで", "when": "2027年9月", "place": "居酒屋", "outline_zh": "和柏宇談未來。就算說了也沒用？這樣下去可不行。", "extra_zh": "聽力短文：朋友的轉職煩惱", "grammar": ["2.71", "2.42", "2.69", "2.135", "2.136", "2.134"], "words": [], "outline_ja": "柏宇と将来を話す。言ったところで無駄？このままではいけない。", "extra_ja": "友人の転職の悩み", "grammar_titles": ["としたら／とすれば", "たところで", "ところを", "ようでは", "ようなら／ようだったら", "ようで"]}, {"id": "N2-L21", "no": 21, "chapter": "C3", "title": "雨につき", "when": "2027年10月", "place": "人物訪談", "outline_zh": "訪談：完工活動一波三折，每次遇到困難都覺得值得。", "extra_zh": "", "grammar": ["2.28", "2.102", "2.103", "2.29", "2.34", "2.7"], "words": [], "outline_ja": "インタビュー：完成イベントは波乱続き。困難のたびにやりがいを感じた。", "extra_ja": "", "grammar_titles": ["ことなく／こともなく", "につき", "につけ／につけては／につけても", "ごとに", "次第／次第だ／次第で（は）", "甲斐がある／甲斐がない／甲斐もなく"]}, {"id": "N2-L22", "no": 22, "chapter": "C3", "title": "完成したかと思うと", "when": "2027年11月", "place": "商店街", "outline_zh": "招牌一掛上去就來了電視台。山本終於笑了。", "extra_zh": "聽力短文：地方電視台的現場報導", "grammar": ["2.14", "2.63", "2.13", "2.24", "2.112", "2.36"], "words": [], "outline_ja": "看板が掛かったかと思うとテレビ局が来る。山本がようやく笑う。", "extra_ja": "地方局の現場リポート", "grammar_titles": ["か〜ないかのうちに", "（か）と思うと／（か）と思ったら", "かと思えば", "きり／きりだ", "抜く", "ずにすむ／ないですむ／なくてすむ"]}, {"id": "N2-L23", "no": 23, "chapter": "C3", "title": "責任という言葉", "when": "2027年12月", "place": "社論", "outline_zh": "社論：無法只用一句話帶過的設計責任。", "extra_zh": "", "grammar": ["2.31", "2.30", "2.70", "2.56", "2.123", "2.57"], "words": [], "outline_ja": "社説：一言では済まされないデザインの責任。", "extra_ja": "", "grammar_titles": ["ことは〜が", "ことにはならない", "としか言いようがない", "ではすまされない", "もかまわず", "てまで"]}, {"id": "N2-L24", "no": 24, "chapter": "C3", "title": "やろうではないか", "when": "2028年1月", "place": "ひだまりハウス", "outline_zh": "雨晴想進修，即使辭職也要學？和美咲、エマ談。", "extra_zh": "聽力短文：研究所說明會", "grammar": ["2.5", "2.122", "2.51", "2.61", "2.125", "2.17"], "words": [], "outline_ja": "雨晴は学び直したいと思う。辞めてでも学ぶのか。美咲、エマと話す。", "extra_ja": "大学院の説明会", "grammar_titles": ["（よ）うではないか／（よ）うじゃないか", "まい／まいか", "てでも", "というより", "も〜なら〜も〜だ", "からいいようなものの"]}, {"id": "N2-L25", "no": 25, "chapter": "C3", "title": "デザインとは何かというと", "when": "2028年2月", "place": "志望理由書", "outline_zh": "雨晴寫研究所的志願書全文。N2 整理與複習。", "extra_zh": "", "grammar": ["S2.0"], "words": [], "outline_ja": "雨晴の大学院の志望理由書の全文。N2の整理と復習。", "extra_ja": "", "grammar_titles": ["かというと／かといえば"]}, {"id": "N2-L26", "no": 26, "chapter": "C3", "title": "次の場所へ", "when": "2028年3月", "place": "デザイン会社", "outline_zh": "離職道別，走過招牌街。N2 總複習（沒有新文法）。", "extra_zh": "聽力短文：離職致詞", "grammar": [], "words": [], "outline_ja": "退職のあいさつをし、看板の通りを歩く。N2の総復習（新しい文法なし）。", "extra_ja": "退職のスピーチ", "grammar_titles": []}], "N1": [{"id": "N1-L01", "no": 1, "chapter": "C1", "title": "研究の幕開け", "when": "2028年4月", "place": "入學致詞", "outline_zh": "校長的入學致詞：以今年為開端，走過漫長的歷史。", "extra_zh": "", "grammar": ["1.184", "1.191", "1.183", "1.193", "1.185", "1.192"], "words": [], "outline_ja": "入学式の式辞：今年を皮切りに、長い歴史を経て。", "extra_ja": "", "grammar_titles": ["を皮切りに（して）", "を振り出しに", "を限りに", "をもって／をもちまして", "を機に", "を経て"]}, {"id": "N1-L02", "no": 2, "chapter": "C1", "title": "席に着くなり", "when": "2028年4月", "place": "研究室", "outline_zh": "第一次進研究室。一坐下就被提問，才開口就被打斷。", "extra_zh": "聽力短文：系上的注意事項", "grammar": ["1.16", "1.20", "1.175", "1.113", "1.37", "1.177"], "words": [], "outline_ja": "初めての研究室。座るなり質問され、口を開くそばから遮られる。", "extra_ja": "学科の注意事項", "grammar_titles": ["が最後／たら最後", "が早いか", "や／や否や", "なり", "そばから", "矢先に"]}, {"id": "N1-L03", "no": 3, "chapter": "C1", "title": "京都ならではの文字", "when": "2028年5月", "place": "紀行文", "outline_zh": "紀行：京都老店招牌，不僅限於店面，更成了城市的臉。", "extra_zh": "", "grammar": ["1.112", "1.143", "1.153", "1.171", "1.181"], "words": [], "outline_ja": "紀行：京都の老舗の看板は、店にとどまらず町の顔になった。", "extra_ja": "", "grammar_titles": ["ならでは／ならではの", "にとどまらず", "はおろか", "もさることながら", "をおいて"]}, {"id": "N1-L04", "no": 4, "chapter": "C1", "title": "散歩がてら", "when": "2028年5月", "place": "研究室・大学周辺", "outline_zh": "邊打工邊讀書。和蓮散步時順便討論調查計畫。", "extra_zh": "聽力短文：大學附近的店家介紹", "grammar": ["1.19", "1.17", "1.18", "1.25", "1.29"], "words": [], "outline_ja": "働きながら学ぶ。蓮と散歩がてら調査計画を話し合う。", "extra_ja": "大学周辺の店の紹介", "grammar_titles": ["がてら", "かたがた", "かたわら", "ことだし", "こともあって"]}, {"id": "N1-L05", "no": 5, "chapter": "C1", "title": "文字であれ色であれ", "when": "2028年6月", "place": "論文導讀", "outline_zh": "導讀：不論文字或顏色，符號都帶著文化的意義。", "extra_zh": "", "grammar": ["1.52", "1.84", "1.75", "1.115", "1.178"], "words": [], "outline_ja": "文献紹介：文字であれ色であれ、記号は文化的な意味を持つ。", "extra_ja": "", "grammar_titles": ["であれ〜であれ／であろうと〜であろうと／だろうが〜だろうが", "といわず〜といわず", "といい〜といい", "なり〜なり", "やれ〜やれ〜"]}, {"id": "N1-L06", "no": 6, "chapter": "C1", "title": "結果いかんで", "when": "2028年7月", "place": "研究室", "outline_zh": "申請獎學金，看結果才能決定。雨晴不顧周圍勸阻堅持題目。", "extra_zh": "聽力短文：獎學金的公告", "grammar": ["1.3", "1.4", "1.194", "1.197", "1.111"], "words": [], "outline_ja": "奨学金に応募。結果いかんで決まる。周囲の忠告をよそにテーマを貫く。", "extra_ja": "奨学金のお知らせ", "grammar_titles": ["いかんで／いかんでは／いかんによっては／いかんにかかっている／いかんだ", "いかんにかかわらず／いかんによらず／いかんをとわず", "をものともせずに", "をよそに", "ならいざしらず"]}, {"id": "N1-L07", "no": 7, "chapter": "C1", "title": "と思いきや", "when": "2028年8月", "place": "小說", "outline_zh": "短篇小說：招牌師傅的一天，事情總不如預期。", "extra_zh": "", "grammar": ["1.80", "1.95", "1.94", "1.174", "1.86"], "words": [], "outline_ja": "短編小説：看板職人の一日。物事は予想どおりにいかない。", "extra_ja": "", "grammar_titles": ["といえども", "とはいえ", "とはいうものの／とは言い条", "ものを", "（か）と思いきや"]}, {"id": "N1-L08", "no": 8, "chapter": "C1", "title": "言わんばかりの顔", "when": "2028年9月", "place": "学会の懇親会", "outline_zh": "學會懇親會。教授的表情彷彿在說些什麼，雨晴似懂非懂。", "extra_zh": "聽力短文：學會開場的廣播", "grammar": ["1.201", "1.96", "1.100", "1.106", "1.22"], "words": [], "outline_ja": "学会の懇親会。教授は何か言わんばかりの顔で、雨晴はわかったようなわからないような。", "extra_ja": "学会の開会アナウンス", "grammar_titles": ["んばかりに／んばかりの／んばかりだ", "とばかりに", "ともなく／ともなしに", "ながらに／ながらの", "嫌いがある"]}, {"id": "N1-L09", "no": 9, "chapter": "C1", "title": "外国人とあって", "when": "2028年10月", "place": "新聞評論", "outline_zh": "評論：因為是留學生而受到的期待與限制。", "extra_zh": "", "grammar": ["1.72", "1.74", "1.73", "1.154", "1.179"], "words": [], "outline_ja": "評論：留学生だからこそ受ける期待と制約。", "extra_ja": "", "grammar_titles": ["とあって", "とあれば", "とあっては", "ばこそ", "（が）ゆえ（に）／ゆえの"]}, {"id": "N1-L10", "no": 10, "chapter": "C1", "title": "子どもじゃあるまいし", "when": "2028年11月", "place": "研究室", "outline_zh": "蓮遲交被罵。「又不是小孩」的直接語氣和後悔。", "extra_zh": "聽力短文：同學的語音牢騷", "grammar": ["1.56", "1.199", "1.200", "1.87", "1.82", "1.176"], "words": [], "outline_ja": "蓮が提出に遅れて叱られる。「子どもじゃあるまいし」という直接的な言い方と後悔。", "extra_ja": "同級生のぼやきのボイスメッセージ", "grammar_titles": ["ではあるまいし／じゃあるまいし", "んじゃなかった", "んだって／んですって", "ときたら", "といったらありはしない／といったらありゃしない／といったらない／ったらない／ったらありゃしない", "やしない／はしない"]}, {"id": "N1-L11", "no": 11, "chapter": "C1", "title": "学ぶべく", "when": "2028年12月", "place": "學術隨筆", "outline_zh": "隨筆：為了學習而來的人該有的態度，什麼是學者不該做的。", "extra_zh": "", "grammar": ["1.161", "1.162", "1.163", "1.160", "1.164", "1.198"], "words": [], "outline_ja": "随筆：学ぶべく来た者の態度と、学者にあるまじきこと。", "extra_ja": "", "grammar_titles": ["べく", "べくして", "べくもない", "べからず／べからざる", "まじき", "んがため（に）／んがための"]}, {"id": "N1-L12", "no": 12, "chapter": "C2", "title": "想像にかたくない", "when": "2029年1月", "place": "研究室", "outline_zh": "研究遇到瓶頸。想做也做不到，既然如此乾脆放手一試。", "extra_zh": "聽力短文：指導教授的建議留言", "grammar": ["1.131", "1.12", "1.35", "1.66", "1.64", "1.67"], "words": [], "outline_ja": "研究が行き詰まる。やろうにもできない。ならばだめでもともとでやってみる。", "extra_ja": "指導教授からの助言の留守電", "grammar_titles": ["にかたくない", "（よ）うにも〜ない", "術がない", "てもどうにもならない／てもどうなるものでもない", "ても知らない", "てもともとだ"]}, {"id": "N1-L13", "no": 13, "chapter": "C2", "title": "学者たるもの", "when": "2029年2月", "place": "評論", "outline_zh": "評論：身為研究者該如何；在此時代才有的難題。", "extra_zh": "", "grammar": ["1.101", "1.99", "1.48", "1.116", "1.119", "1.135"], "words": [], "outline_ja": "評論：研究者たるものどうあるべきか。この時代ならではの難題。", "extra_ja": "", "grammar_titles": ["ともなると／ともなれば", "ともあろうものが", "たる／たるもの", "なりに／なりの", "にあって（は）／にあっても", "にして"]}, {"id": "N1-L14", "no": 14, "chapter": "C2", "title": "論文にかまけて", "when": "2029年3月", "place": "ひだまりハウス", "outline_zh": "只顧著論文冷落朋友。美咲叫她回家吃飯。", "extra_zh": "聽力短文：民宿的近況分享", "grammar": ["1.157", "1.132", "1.130", "1.62", "1.57", "1.60"], "words": [], "outline_ja": "論文にかまけて友人を放っておく。美咲が食事に呼ぶ。", "extra_ja": "民宿の近況", "grammar_titles": ["はそっちのけで／をそっちのけで", "にかまけて", "にかこつけて", "ても差し支えない", "てはかなわない", "てはやりきれない"]}, {"id": "N1-L15", "no": 15, "chapter": "C2", "title": "昔にひきかえ", "when": "2029年4月", "place": "報導", "outline_zh": "報導：和過去相比，招牌業界發生的變化。", "extra_zh": "", "grammar": ["1.146", "1.148", "1.104", "1.85", "1.21"], "words": [], "outline_ja": "報道：昔にひきかえ、看板業界に起きた変化。", "extra_ja": "", "grammar_titles": ["にひきかえ／にひきかえて", "にも増して", "ないまでも", "と（は）打って変わって", "からある／からする／からの"]}, {"id": "N1-L16", "no": 16, "chapter": "C2", "title": "ついに中止に至る", "when": "2029年5月", "place": "調査先の町", "outline_zh": "田野調查到一半被迫中止，事情落到這般田地。", "extra_zh": "聽力短文：地方局的新聞", "grammar": ["1.120", "1.121", "1.30", "1.32", "1.159", "1.46"], "words": [], "outline_ja": "調査の途中で中止に追い込まれ、こんな羽目になる。", "extra_ja": "地方局のニュース", "grammar_titles": ["に至って／に至る／に至っては／に至っても", "に至るまで", "始末だ", "ずじまいだ", "羽目になる／羽目に陥る", "たらきりがない／ばきりがない"]}, {"id": "N1-L17", "no": 17, "chapter": "C2", "title": "一日たりとも", "when": "2029年6月", "place": "人物傳", "outline_zh": "傳記：一位字體師傅，一天也不曾停筆；這正是他的人生。", "extra_zh": "", "grammar": ["1.47", "1.36", "1.44", "1.1", "1.2", "1.55"], "words": [], "outline_ja": "伝記：一日たりとも筆を止めなかった字体職人の人生。", "extra_ja": "", "grammar_titles": ["たりとも", "（で）すら", "だに", "あっての", "以外の何ものでもない", "でなくてなんだろう"]}, {"id": "N1-L18", "no": 18, "chapter": "C2", "title": "謝るまでもない", "when": "2029年7月", "place": "研究室", "outline_zh": "錯誤被抓包。教授說不用道歉，只要改就好。", "extra_zh": "聽力短文：研究室的值日交代", "grammar": ["1.167", "1.166", "1.158", "1.118", "1.124", "1.165"], "words": [], "outline_ja": "ミスが見つかる。教授は謝るまでもない、直せばいいと言う。", "extra_ja": "研究室の当番の引き継ぎ", "grammar_titles": ["までもなく／までもない", "までだ／までのことだ", "ばそれまでだ", "に（は）あたらない", "に（は）及ばない", "までして"]}, {"id": "N1-L19", "no": 19, "chapter": "C2", "title": "読むに足る本", "when": "2029年8月", "place": "書評", "outline_zh": "書評：值得一讀的書和不忍卒睹的作品。", "extra_zh": "", "grammar": ["1.140", "1.141", "1.139", "1.117", async function ensureLevel(level) {
  if (DATA.plans[level]) return;
  app.innerHTML = `<p class="score">${lang === "ja" ? "読み込んでいます…" : "讀取中…"}</p>`;
  const r = await fetchBundle(level);
  if (!r.ok) throw new Error(r.status);
  const b = await r.json();
  DATA.plans[level] = b.plan;

  initData();
}

  const LEAF = { jp: ["日文", "日本語"], zh: ["中文", "中国語"], note_zh: ["附註", "注"], word: ["單字", "単語"], reading: ["讀音", "読み"], stem: ["題目", "問題文"], q: ["題目", "問題文"], options: ["選項", "選択肢"],
    answer: ["答案", "答え"], explanation_zh: ["解說", "解説"], notes_zh: ["ポイント", "ポイント"], meaning_zh: ["意思", "意味"], story_zh: ["故事", "ストーリー"], ja: ["日文版", "日本語版"] };
  function label(path) {

    const rest = path.slice(2), out = [];
    rest.forEach((k, i) => {

      else if (k === "lines" || k === "script" || k === "text" || k === "items") return;

  const STATE = { pending: "", applied: ["已套用", "適用済み"], rejected: ["已略過", "見送り"], merged: ["已併入", "反映済み"] };

  function drawLogin() {
    if (loginMode === "forgot") return `<form class="ed-body" id="edForgot"><p style="margin:0">${T("輸入帳號的 email，我們會寄一封重設密碼的連結給你。", "アカウントのメールアドレスを入力してください。パスワード再設定のリンクをお送りします。")}</p>

  function drawPassword() {
    if (pwDone) return `<div class="ed-body"><p class="ed-status" role="status">${T("密碼已更新。下次登入請用新密碼。", "パスワードを更新しました。次回から新しいパスワードでログインしてください。")}</p>
      <div class="ed-btns"><button class="act" data-ed-view="chat">${T("回到對話", "会話に戻る")}</button></div></div>`;
    return `<form class="ed-body" id="edPw"><h4 style="margin:0">${recovery ? T("設定新密碼", "新しいパスワードの設定") : T("修改密碼", "パスワードの変更")}</h4>
      ${recovery ? "" : `<label class="ed-field">${T("目前的密碼", "現在のパスワード")}<input type="password" id="edPwOld" required autocomplete="current-password"></label>`}
      <label class="ed-field">${T("新密碼（至少 8 個字元）", "新しいパスワード（8文字以上）")}<input type="password" id="edPwNew" required minlength="8" autocomplete="new-password"></label>
      <label class="ed-field">${T("再輸入一次新密碼", "新しいパスワード（確認）")}<input type="password" id="edPwNew2" required minlength="8" autocomplete="new-password"></label>
      <div class="ed-btns"><button class="act">${T("儲存", "保存")}</button>${recovery ? "" : `<button type="button" class="act ghost" data-ed-view="chat">${T("取消", "キャンセル")}</button>`}</div>
      ${pwError ? `<p class="ed-msg err" role="alert">${esc(pwError)}</p>` : ""}</form>`;
  }
  function setSession(d) {
    auth = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() / 1000 + (d.expires_in || 3600) };
    LS.set("jp-auth", auth);
    authListener?.();
  }
  const authFetch = (path, body, method = "POST", bearer = REMOTE.key) => fetch(`${REMOTE.url}/auth/v1/${path}`, { method,
    headers: { apikey: REMOTE.key, Authorization: `Bearer ${bearer}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  // 登入不成功時，不分辨是帳號還是密碼錯，避免讓人試出有哪些帳號
  function authError(r) {
    if (r.status === 400) return T("email 或密碼不正確。", "メールアドレスまたはパスワードが正しくありません。");
    if (r.status === 429) return T("嘗試太多次，請稍後再試。", "試行回数が多すぎます。しばらくしてからお試しください。");
    return T("目前無法處理，請稍後再試。", "現在処理できません。しばらくしてからお試しください。");
  }
  async function changePassword() {
    pwError = ""; pwDone = false;
    const oldPw = $("#edPwOld")?.value, a = $("#edPwNew").value, b = $("#edPwNew2").value;
    if (a !== b) { pwError = T("兩次輸入的新密碼不一樣。", "新しいパスワードが一致しません。"); return draw() }
    if (!recovery && a === oldPw) { pwError = T("新密碼要和目前的不同。", "現在と異なるパスワードにしてください。"); return draw() }
    if (!recovery) { // 先確認目前的密碼，別人拿到開著的電腦也改不了
      const email = me?.email || (await checkMe(), me?.email);
      const r = await authFetch("token?grant_type=password", { email, password: oldPw });
      if (!r.ok) { pwError = r.status === 400 ? T("目前的密碼不正確。", "現在のパスワードが正しくありません。") : authError(r); return draw() }
      setSession(await r.json());
    }
    const t = await token();
    const r = await authFetch("user", { password: a }, "PUT", t);
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      pwError = d.error_code === "same_password" ? T("新密碼要和目前的不同。", "現在と異なるパスワードにしてください。")
        : d.error_code === "weak_password" ? T("這個密碼太簡單，請換一個。", "このパスワードは簡単すぎます。別のものにしてください。") : authError(r);
      return draw();
    }
    recovery = false; pwDone = true; view = "password"; draw();
  }
  function draw() {
    const btn = $("#editBtn");
    if (btn) btn.textContent = auth ? T("AI 微調", "AIで修正") : T("老師登入", "先生ログイン");
    const el = panel(); if (!el || el.hidden) return;
    const noPerm = auth && me && !me.editor;
    el.innerHTML = `<div class="ed-head"><b>${T("AI 微調", "AIで修正")}${lessonId() ? `・${T("第", "第")}${+lessonId().slice(-2)}${T(" 課", "課")}` : ""}</b>
      ${auth && !recovery ? `<button class="toggle" data-ed-pw>${T("改密碼", "パスワード変更")}</button>` : ""}${auth ? `<button class="toggle" data-ed-logout>${T("登出", "ログアウト")}</button>` : ""}<button class="ed-x" data-ed-close aria-label="${T("關閉", "閉じる")}">×</button></div>
      ${!auth ? drawLogin() : view === "password" ? drawPassword() : noPerm ? `<div class="ed-body"><p>${T(`這個帳號（${esc(me.email)}）沒有編輯權限，請聯絡課程負責人。`, `このアカウント（${esc(me.email)}）には編集権限がありません。担当者にご連絡ください。`)}</p></div>` : view === "history" ? drawHistory() : drawChat()}`;
    const b = $("#edBody"); if (b) b.scrollTop = b.scrollHeight;
  }
  // freshAccess：登入或登出後，其他級別之前讀到的內容也要重讀
  async function reloadCourse(freshAccess) {
    const y = window.scrollY, tab = $('#seg button[aria-current="true"]')?.dataset.tab;
    const r = await fetchBundle(REMOTE.level || "N5");
    if (!r.ok) return;
    const b = await r.json(), lv = lessonId()?.slice(0, 2) || "N5";
    const r2 = lv === "N5" ? b : await (await fetchBundle(lv)).json();
    const plans = freshAccess === true ? {} : DATA.plans;
    DATA = b; DATA.plans = { ...plans, N5: b.plan, [lv]: r2.plan };
    Object.assign(DATA.lessons, r2.lessons || {}); Object.assign(DATA.audio, r2.audio || {});
    initData(); await route();
    if (tab) $(`#seg button[data-tab="${tab}"]`)?.click();
    window.scrollTo(0, y);
  }
  async function send(text) {
    log.push({ role: "me", text }); busy = true; status = ""; save(); draw();
    try {
      const r = await call({ action: "chat", text, lesson: lessonId(), session_id: session, events });
      if (r.status === 401) { logout(); throw new Error(T("登入已過期，請重新登入。", "ログインの期限が切れました。もう一度ログインしてください。")) }
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || d.message || r.status) }
      events = [];
      const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      const TOOLS = { read_section: T("讀課程內容…", "課の内容を読んでいます…"), find_text: T("搜尋中…", "検索しています…"), propose_edit: T("整理修改提案…", "修正案をまとめています…"), leave_note: T("留言中…", "伝言しています…") };
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const m = JSON.parse(line);
          if (m.type === "text") log.push({ role: "ai", text: m.text });
          else if (m.type === "proposal") log.push({ edit: m.edit, state: "pending" });
          else if (m.type === "note") log.push({ role: "ai", text: T("（已留言給課程編輯者）", "（編集担当者に伝言しました）") });
          else if (m.type === "error") log.push({ role: "err", text: m.message });
          else if (m.type === "status") status = TOOLS[m.tool] || "";
          else if (m.type === "done") session = m.session_id;
          if (m.type !== "ping") { save(); draw() }
        }
      }
    } catch (e) { log.push({ role: "err", text: e.message }) }
    busy = false; status = ""; save(); draw(); $("#edText")?.focus();
  }
  async function act(fn, i) {
    try { await fn(i) } catch (e) { log.push({ role: "err", text: e.message }); view = "chat" }
    save(); draw();
  }
  async function openHistory() {
    view = "history"; history = [];
    if (lessonId()) history = await callJson({ action: "history", lesson: lessonId() }).catch(() => []);
    draw();
  }
  async function checkMe() { if (auth) try { me = await callJson({ action: "me" }) } catch (e) {} }

  function init() {
    if (!REMOTE) return;
    const opened = readLoginLink();
    const btn = $("#editBtn"); btn.hidden = false;
    btn.onclick = async () => { const el = panel(); el.hidden = !el.hidden; if (!el.hidden) await checkMe(); draw() };
    window.addEventListener("hashchange", () => { if (view === "history") openHistory(); else draw() });
    panel().addEventListener("submit", async e => {
      e.preventDefault();
      if (e.target.id === "edForm") { const t = $("#edText").value.trim(); if (t && !busy) send(t) }
      if (e.target.id === "edLogin") {
        loginError = "";
        const r = await authFetch("token?grant_type=password", { email: $("#edEmail").value.trim(), password: $("#edPass").value });
        if (r.ok) { setSession(await r.json()); await checkMe(); reloadCourse(true) } else loginError = authError(r);
        draw();
      }
      if (e.target.id === "edForgot") {
        sent = false; loginError = "";
        const r = await authFetch(`recover?redirect_to=${encodeURIComponent(location.origin + location.pathname)}`, { email: $("#edEmail").value.trim() });
        if (r.ok) sent = true; else loginError = authError(r);
        draw();
      }
      if (e.target.id === "edPw") changePassword();
    });
    panel().addEventListener("keydown", e => { if (e.target.id === "edText" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#edForm").requestSubmit() } });
    panel().addEventListener("click", e => {
      const q = a => e.target.closest(`[${a}]`);
      if (q("data-ed-close")) { panel().hidden = true; return }
      if (q("data-ed-logout")) return logout();
      if (q("data-ed-pw")) { view = "password"; pwError = ""; pwDone = false; return draw() }
      if (q("data-ed-mode")) { loginMode = q("data-ed-mode").dataset.edMode; sent = false; loginError = ""; return draw() }
      if (q("data-ed-new")) { log = []; session = null; events = []; save(); return draw() }
      if (q("data-ed-view")) { const v = q("data-ed-view").dataset.edView; if (v === "history") openHistory(); else { view = v; draw() } return }
      const ap = q("data-ed-apply"), rj = q("data-ed-reject"), rv = q("data-ed-revert");
      if (ap) return act(async i => { const it = log[i]; await callJson({ action: "apply", id: it.edit.id }); it.state = "applied"; events.push(`（老師已套用提案 #${it.edit.id}）`); await reloadCourse(); await runVoice(it, it.edit.id) }, +ap.dataset.edApply);
      if (rj) return act(async i => { const it = log[i]; await callJson({ action: "reject", id: it.edit.id }); it.state = "rejected"; events.push(`（老師沒有採用提案 #${it.edit.id}）`) }, +rj.dataset.edReject);
      if (rv) return act(async id => {
        const rev = await callJson({ action: "revert", id }), its = log.filter(x => x.edit && x.edit.id === id);
        its.forEach(x => x.state = "rejected"); events.push(`（老師復原了提案 #${id}）`); await reloadCourse();
        if (its[0]) { its[0].revertId = rev.id; await runVoice(its[0], rev.id) } else await callJson({ action: "voice", id: rev.id }).then(reloadCourse).catch(() => {});
        if (view === "history") await openHistory();
      }, +rv.dataset.edRevert);
      const vo = q("data-ed-voice");
      if (vo) return act(i => runVoice(log[i], log[i].revertId || log[i].edit.id), +vo.dataset.edVoice);
    });
    if (opened) { panel().hidden = false; checkMe().then(draw) }
    draw();
  }
  // AI 對話練習（jp-roleplay）
  async function roleplay(body) {
    const t = await token();
    if (!t) { open(); throw { shown: "請先登入。" } }
    const r = await fetch(`${REMOTE.url}/functions/v1/jp-roleplay`, { method: "POST", headers: { apikey: REMOTE.key, Authorization: `Bearer ${t}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { logout(); open() }
    if (!r.ok) throw { shown: d.error || "AI 沒有回應，請再送一次。" };
    return d;
  }
  async function open() { panel().hidden = false; await checkMe(); draw() }
  // 老師認證：按 OK 後 App 才會上架這一課
  async function approve(id, ok) {
    try { await callJson({ action: "approve", lesson: id, ok }); await reloadCourse() }
    catch (e) { window.alert(e.message) }
  }
  return { init, draw, roleplay, open, approve, token, signedIn: () => !!auth, onAuth: f => { authListener = f } };
})();
async function boot() {
  if (!DATA && REMOTE) {
    app.innerHTML = `<p class="score">${lang === "ja" ? "Supabase からデータを読み込んでいます…" : "正在從 Supabase 讀取課程資料…"}</p>`;
    try {
      const r = await fetchBundle(REMOTE.level || "N5");
      if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
      DATA = await r.json();
    } catch (e) {
      app.innerHTML = `<div class="flag">讀取失敗：${esc(e.message)}。請重新整理頁面。</div>`; return;
    }
  }
  initData();
  route();
}
Ed.init();
boot();
</script>
